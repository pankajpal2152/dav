<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To DAV Public School</title>
    <!-- Css link start -->
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <!-- Css link end -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>
    <div id="header"></div>

    <div class="">
    <div class="container">
        <div class="pt-3  space-bottom">
            <div id="div_photo_load" class="row"></div>
        </div>
    </div>
    <div id="image_gallery_popup" class="modal fade">
        <div class="modal-dialog" style="display: table !important;min-width: 80%;overflow: auto;">
            <div class="modal-content">
                <div class="modal-header sub-header">
                    <h4 class="modal-title" style="font-size: 16px;">Image Gallery</h4>
                    <button type="button" class="close" data-dismiss="modal" style="color:#fff;">×</button>
                </div>
                <div class="modal-body img-gallery-model">
                    <div class="pt-3">
                        <div id="div_image_load_all" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Js.js"></script>
    <script src="/Assest/js/site-data.js"></script>
    <script>
        // shared header / footer
        fetch("/Layout/Layout-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Error loading header:", error); });

        fetch("/Layout/Layout-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Error loading footer:", error); });
    </script>
    <script>
        $(function () {
            var box = document.getElementById("div_photo_load");
            SiteData.getRows("/api/ourSchool/api-get-view-gallery-image?ITEM=VIEW_ALL&GALLERY_SYS_ID=0")
                .then(function (rows) {
                    SiteData.renderGalleries(box, rows);
                    // a link like Photo-Gallery.html?GALLERY_SYS_ID=5 opens that gallery directly
                    var id = new URLSearchParams(location.search).get("GALLERY_SYS_ID");
                    if (id) {
                        var match = rows.filter(function (g) { return String(g.GALLERY_SYS_ID) === id; })[0];
                        $(".open-gallery[data-id='" + id + "']").first().trigger("click");
                    }
                })
                .catch(function () { box.innerHTML = '<div class="col-12 text-center">Unable to load galleries.</div>'; });
        });
    </script>
</body>

</html>
