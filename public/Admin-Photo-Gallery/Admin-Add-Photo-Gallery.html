<!-- No DOCTYPE on purpose: the live Add Gallery page renders in browser "quirks mode" and its table/input heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid addGallery-mobiledisplay">
        <h4 class="mt-2" style="text-decoration:underline; text-align: center; font-weight: bold; color: #751120; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif">Gallery Control</h4>
        <br>
        <div class="container-fluid">
            <form action="/" enctype="multipart/form-data" id="transform_certificate_gallery_form" method="post" onsubmit="return false;">
                <div class="col-sm-12 margin-0">
                    <div class="row margin-row-0 title-row" style="border-width:5px; border-color:black">
                        <div class="col-sm-4 margin-0">
                            <label>Gallery Title:</label><span style="color:red;">*</span>
                            <div class="form-group">
                                <input autocomplete="off" class="form-control text-box single-line" id="txt_title" name="TITLE" placeholder="Enter Title" type="text" value="">
                            </div>
                        </div>
                        <div class="col-sm-4 margin-0">
                            <label>Gallery Description:</label><span style="color:red;">*</span>
                            <div class="form-group">
                                <input autocomplete="off" class="form-control text-box single-line" id="txt_description" name="DESCRIPTION" placeholder="Enter Description" type="text" value="">
                            </div>
                        </div>
                        <div class="col-sm-4 margin-0">
                            <label>Select Number of Images:</label><span style="color:red;">*</span>
                            <select name="" id="ddl_numbers" class="form-control">
                                <option selected="selected" value="0">Select Number of Images</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                                <option value="17">17</option>
                                <option value="18">18</option>
                                <option value="19">19</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>
                    <table class="table add-header-photo-table" id="tbl_main_contents_header"></table>
                    <table class="table add-photo-table" id="tbl_main_contents_view"></table>
                    <div id="div_save_image" class="pb-5">
                        <button type="button" class="btn btn-primary pull-right" title="Save" id="btn_gallery_save">
                            Save
                        </button>
                    </div>
                    <div id="div_inputareas" class="mt-3 matrix_tableView table table-responsive">
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) {
                document.getElementById("header").innerHTML = html;
                // this page on the live site has a larger Home icon
                var home = $(".navbar-dav > ul > li:first-child a")[0];
                home.style.paddingTop = "16px";
                home.style.paddingBottom = "17px";
                home.querySelector("i").style.setProperty("font-size", "18px", "important");
            })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        var MAX_IMAGE_SIZE = 2 * 1024 * 1024; // "Max. image Size 2 MB."

        $("#div_save_image").hide();

        // build the image rows (same table layout as the live site)
        $("#ddl_numbers").change(function () {
            var count = parseInt($("#ddl_numbers option:selected").val(), 10) || 0;
            var head = $("#tbl_main_contents_header");
            var body = $("#tbl_main_contents_view");

            head.html("");
            body.html("");

            if (count < 1) {
                $("#div_save_image").hide();
                return;
            }

            $("#div_save_image").show();
            $("#div_inputareas").show();
            head.append('<tr><th>Sl.No.</th><th>Choose Image </th><th> Image Description</th><th> Choose Thumbnail </th></tr>');

            for (var nr = 1; nr <= count; nr++) {
                body.append('<tr><td>' + nr + '</td><td><div class=""><input type="file" accept=".jpg,.png" name="galery_file" id="galery_file' + nr + '"><div><span style="color:Red;font-size:12px;">Max. image Size 2 MB.</span> </div></div></td><td><input name="captionname" type="text" maxlength="100" class="form-control text_box txt_caption" autocomplete="off" /><label class="left-character">Character left:<span class="number_value">100</span></label> </td><td> <div class=""> <span class="select_table_Box" style="display:inline-block;border-style:None;"><input class="checkbox_thumbnail" type="radio" name="thumbnail_name" checked /></span> </div></td></tr>');
            }
        });

        // "Character left" counter
        $(document).on("keyup input paste", ".txt_caption", function () {
            $(this).siblings(".left-character").find(".number_value").text(100 - $(this).val().length);
        });

        // save
        $("#btn_gallery_save").on("click", async function () {
            var button = this;
            var title = $("#txt_title").val().trim();
            var description = $("#txt_description").val().trim();
            var rows = $("#tbl_main_contents_view tr");

            if (!title) { alert("Please enter gallery title."); $("#txt_title").focus(); return; }
            if (!description) { alert("Please enter gallery description."); $("#txt_description").focus(); return; }
            if (rows.length === 0) { alert("Please select number of images."); $("#ddl_numbers").focus(); return; }

            var images = [];
            for (var i = 0; i < rows.length; i++) {
                var row = $(rows[i]);
                var file = row.find("input[type=file]")[0].files[0];
                var caption = row.find(".txt_caption").val().trim();
                var n = i + 1;

                if (!file) { alert("Please choose image for Sl.No. " + n + "."); return; }
                if (!/\.(jpe?g|png)$/i.test(file.name)) { alert("Sl.No. " + n + ": only .jpg or .png images are allowed."); return; }
                if (file.size > MAX_IMAGE_SIZE) { alert("Sl.No. " + n + ": image size must be 2 MB or less."); return; }
                if (!caption) { alert("Please enter image description for Sl.No. " + n + "."); row.find(".txt_caption").focus(); return; }

                images.push({ file: file, caption: caption, thumbnail: row.find(".checkbox_thumbnail").is(":checked") });
            }

            if (!DavApi.requireLogin()) return;

            // make sure exactly one image is the thumbnail
            if (!images.some(function (x) { return x.thumbnail; })) images[0].thumbnail = true;
            var thumbnailIndex = images.map(function (x) { return x.thumbnail; }).lastIndexOf(true);

            try {
                await DavApi.busy(button, async function () {
                    // 1. create the gallery
                    await DavApi.post("api-post-add-update-image-gallery", {
                        ITEM: "ADD",
                        RECORD_SYS_ID: 0,
                        TITLE: title,
                        DESCRIPTION: description,
                        STATUS: "ACTIVE"
                    });

                    // 2. find its id
                    var list = await DavApi.get("api-get-view-gallery-image?ITEM=VIEW_ALL&GALLERY_SYS_ID=0");
                    var gallery = DavApi.rows(list.response).filter(function (g) { return g.TITLE === title; })[0];
                    var gallerySysId = gallery && (gallery.GALLERY_SYS_ID || gallery.RECORD_SYS_ID);
                    if (!gallerySysId) throw new Error("Gallery created, but its id could not be found.");

                    // 3. upload each image to S3 and link it to the gallery
                    for (var j = 0; j < images.length; j++) {
                        var uploaded = await DavApi.upload("gallery-image", [images[j].file]);
                        await DavApi.post("api-post-add-update-image-gallery", {
                            ITEM: "ADD_GALLERY_PHOTO",
                            GALLERY_SYS_ID: gallerySysId,
                            IMAGE_NAME: uploaded[0].fileName,
                            CAPTION: images[j].caption,
                            THUMBNAIL: j === thumbnailIndex ? "Y" : "N"
                        });
                    }
                });

                alert("Gallery saved successfully.");
                window.location.reload();
            } catch (error) {
                console.error("Save gallery error:", error);
                alert(error.message || "Unable to save gallery.");
            }
        });
    </script>
</body>

</html>
