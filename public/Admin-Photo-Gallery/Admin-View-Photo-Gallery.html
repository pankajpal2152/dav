<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        /* Column widths of the live Image Gallery table (Sl.No. / Title / Description / Actions) */
        #view_Table { table-layout: fixed; }
        #view_Table th:nth-child(1) { width: 4.86%; }
        #view_Table th:nth-child(2) { width: 36.5%; }
        #view_Table th:nth-child(3) { width: 48.2%; }
        #view_Table th:nth-child(4) { width: 10.44%; }
    </style>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul res_breadcrum">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">View Gallery</a>
            </li>
        </ul>
    </div><br>
    <input type="hidden" id="title_name_hidden">
    <input type="hidden" id="gallery_record_id_hidden">
    <input type="hidden" id="gallery_id_hidden">
    <div class="container-fluid space-bottom">
        <div class="row">
            <div id="view_photo_gallery" class="table-responsive viewVideo-table">
            </div>
        </div>
    </div>
    <div class="modal fade" id="record_delete_popup" style="z-index: 1111111111111111;">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title"> Gallery Record Delete</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <label>Are you sure you want to delete this record ?</label><br>
                    <button id="btn_delete_img_gallery_yes" class="btn btn-success">
                        <i class="fa fa-check"></i>Yes
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="update_image_gallery_popup" style="z-index: 1111111111111111;">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title">Update Image Gallery Record</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <form id="frm_update_img_gallery" class="row" onsubmit="return false;">
                        <div class="form-group col-md-6">
                            <label for="name">Title</label>
                            <input class="form-control text-box single-line" id="txt_title" name="TITLE" placeholder="Title" readonly="readonly" type="text" value="">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="location">Description</label>
                            <input autofocus="true" class="form-control text-box single-line" id="txt_description" name="DESCRIPTION" placeholder="Enter Description" required="true" type="text" value="">
                        </div>
                    </form>
                    <button id="btn_img_gallery_update" class="btn btn-primary">
                        <i class="fa fa-save"></i>Save
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="archive_popup">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title">Archive Record</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <label>Select Session Year:</label><span style="color:red">*</span>
                    <select class="form-control" id="ddl_finyear">
                        <option value="0">-Select-</option>
                        <option value="2020-2021">2020-2021</option>
                        <option value="2021-2022">2021-2022</option>
                        <option value="2022-2023">2022-2023</option>
                        <option value="2023-2024">2023-2024</option>
                        <option value="2024-2025">2024-2025</option>
                        <option value="2025-2026">2025-2026</option>
                        <option value="2026-2027">2026-2027</option>
                        <option value="2027-2028">2027-2028</option>
                        <option value="2028-2029">2028-2029</option>
                        <option value="2029-2030">2029-2030</option>
                    </select><br>
                    <button id="btn_img_gallery_archive_record_save" class="btn btn-success">
                        <i class="fa fa-save"></i>Save
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
    <div id="image_gallery_popup" class="modal fade">
        <div class="modal-dialog" style="max-width: 1050px;overflow: auto;">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title">Image Gallery</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body img-gallery-model">
                    <div class="">
                        <div id="div_image_load" class="row">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade sub-fade" id="image_gallery_delete_popup">
        <div class="modal-dialog" style="transform: translate(10px, 120%);">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title">Record Delete</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <label>Are you sure you want to Delete this record ?</label><br>
                    <button id="btn_delete_singlei_image_yes" class="btn btn-success">
                        Yes
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade sub-fade" id="update_single_image_gallery_popup">
        <div class="modal-dialog" style="transform: translate(10px, 25%);">
            <div class="modal-content" style="width: 420px !important;">
                <!-- Modal Header -->
                <div class="modal-header sub-header">
                    <h4 class="modal-title">Update Image  Record</h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <form id="frm_update_single_img_gallery_form" class="col-lg-12 col-sm-12" onsubmit="return false;">
                        <div class="form-group">
                            <label for="name">Caption<span style="color:red">*</span>:</label>
                            <input class="form-control text-box single-line" id="txt_caption" name="CAPTION" placeholder="Enter Caption" type="text" value="">
                        </div>
                        <div class="form-group">
                            <label>Upload New Image<span style="color:red">*</span>:</label>
                            <input type="file" name="image_file_name" class="form-control" id="image_file_name_">
                        </div>
                        <div class="form-group">
                            <label>Do you want to set it as Thumbnail.?<span style="color:red"></span>:</label><br>
                            <label>Yes</label>:&nbsp;<input type="radio" name="radio_thumbnail" value="Y" id="radio_thumbnail_yes">&nbsp;&nbsp;
                            <label>No</label>:&nbsp;<input type="radio" name="radio_thumbnail" value="N" id="radio_thumbnail_no">
                        </div>
                    </form>
                    <button id="btn_single_image_gallery_update" class="btn btn-primary">
                        Save
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        /* ---------- gallery list ---------- */
        function loadGalleries() {
            var box = $("#view_photo_gallery");
            DavApi.get("api-get-view-gallery-image?ITEM=VIEW_ALL&GALLERY_SYS_ID=0")
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = '<table class="table ig_table" id="view_Table"><thead><tr><th>Sl.No.</th><th>Title</th><th>Description</th><th>Actions</th></tr></thead><tbody>';
                    if (!rows.length) {
                        html += '<tr><td colspan="4">No Data Found</td></tr>';
                    }
                    rows.forEach(function (g, i) {
                        var attrs = ' data-gallery_sys_id="' + esc(g.GALLERY_SYS_ID) + '" data-title="' + esc(g.TITLE) + '" data-description="' + esc(g.DESCRIPTION) + '"';
                        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(g.TITLE) + '</td><td>' + esc(g.DESCRIPTION) + '</td><td>' +
                            '<button type="button" data-toggle="modal" data-target="#update_image_gallery_popup" id="btn_edit_record" title="Edit" class="btn btn-primary"' + attrs + '>Edit</button>&nbsp;' +
                            '<button type="button" id="btn_delete_record" data-toggle="modal" data-target="#record_delete_popup" title="Delete" class="btn btn-danger"' + attrs + '>Delete</button>&nbsp;' +
                            '<button type="button" data-toggle="modal" data-target="#archive_popup" id="btn_img_gallery_archive" title="archive" class="btn btn-dark"' + attrs + '>Archive</button>&nbsp;&nbsp;' +
                            '<button type="button" id="btn_view_gallery" data-toggle="modal" data-target="#image_gallery_popup" class="btn btn-info" title="View"' + attrs + '>View</button>' +
                            '</td></tr>';
                    });
                    box.html(html + '</tbody></table>');
                })
                .catch(function (error) {
                    console.error("Gallery list error:", error);
                    box.html('<table class="table ig_table" id="view_Table"><thead><tr><th>Sl.No.</th><th>Title</th><th>Description</th><th>Actions</th></tr></thead><tbody><tr><td colspan="4">Unable to load data.</td></tr></tbody></table>');
                });
        }
        $(loadGalleries);

        /* ---------- edit ---------- */
        $(document).on("click", "#btn_edit_record", function () {
            $("#txt_title").val($(this).data("title"));
            $("#txt_description").val($(this).data("description"));
        });
        $(document).on("click", "#btn_img_gallery_update", function () {
            var description = $("#txt_description").val().trim();
            var title = $("#txt_title").val();
            if (!description) { alert("Please Enter Description!"); return false; }
            // an ADD with an existing title updates that gallery's description
            DavApi.post("api-post-add-update-image-gallery", { ITEM: "ADD", RECORD_SYS_ID: 0, TITLE: title, DESCRIPTION: description, STATUS: "ACTIVE" })
                .then(function () { alert("Record updated successfully."); $("#update_image_gallery_popup").modal("hide"); loadGalleries(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- delete ---------- */
        $(document).on("click", "#btn_delete_record", function () { $("#title_name_hidden").val($(this).data("title")); });
        $(document).on("click", "#btn_delete_img_gallery_yes", function () {
            DavApi.post("api-post-add-update-image-gallery", { ITEM: "DELETE_IMAGE_GALLERY", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden").val() })
                .then(function () { alert("Record deleted successfully."); $("#record_delete_popup").modal("hide"); loadGalleries(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- archive ---------- */
        $(document).on("click", "#btn_img_gallery_archive", function () { $("#title_name_hidden").val($(this).data("title")); $("#ddl_finyear").val("0"); });
        $(document).on("click", "#btn_img_gallery_archive_record_save", function () {
            var year = $("#ddl_finyear").val();
            if (!year || year === "0") { alert("Please select session year."); return false; }
            DavApi.post("api-post-add-update-image-gallery", { ITEM: "ARCHIVE_IMAGE_GALLERY", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden").val(), SESSION_YEAR: year })
                .then(function () { alert("Image Archive Successful"); $("#archive_popup").modal("hide"); loadGalleries(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- photos of a gallery ---------- */
        function loadPhotos(id) {
            var box = $("#div_image_load");
            box.html('<div class="col-12">Loading...</div>');
            $("#gallery_id_hidden").val(id);
            DavApi.get("api-get-view-gallery-image?ITEM=VIEW_ALL&GALLERY_SYS_ID=" + encodeURIComponent(id))
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = "";
                    rows.forEach(function (p) {
                        var src = "/Uploadfiles/GalleryImages/" + encodeURIComponent(p.IMAGE_NAME);
                        html += '<div class="gellery-img col-md-4"><div class="img-container"><img src="' + esc(src) + '" alt=""/></div>' +
                            '<div class="img-content"><p>' + esc(p.CAPTION) + '</p>' +
                            '<button type="button" id="btn_edit_image" data-toggle="modal" data-target="#update_single_image_gallery_popup" title="Edit" data-record_sys_id="' + esc(p.RECORD_SYS_ID) + '" data-caption="' + esc(p.CAPTION) + '" data-image_name="' + esc(p.IMAGE_NAME) + '" style="color:blue">Edit</button>&nbsp;||&nbsp;' +
                            '<button type="button" id="btn_delete_single_image" data-toggle="modal" data-target="#image_gallery_delete_popup" title="Delete" data-record_sys_id="' + esc(p.RECORD_SYS_ID) + '" data-image_name="' + esc(p.IMAGE_NAME) + '" style="color:blue">Delete</button>' +
                            '</div></div>';
                    });
                    box.html(html || '<div class="col-12">No photos found.</div>');
                })
                .catch(function () { box.html('<div class="col-12">Unable to load photos.</div>'); });
        }
        $(document).on("click", "#btn_view_gallery", function () { loadPhotos($(this).data("gallery_sys_id")); });

        $(document).on("click", "#btn_delete_single_image", function () {
            $("#gallery_record_id_hidden").val($(this).data("record_sys_id"));
            $("#gallery_record_id_hidden").data("image_name", $(this).data("image_name"));
        });
        $(document).on("click", "#btn_delete_singlei_image_yes", function () {
            var recordId = $("#gallery_record_id_hidden").val();
            var imageName = $("#gallery_record_id_hidden").data("image_name");
            DavApi.post("api-post-add-update-image-gallery", { ITEM: "DELETE_GALLERY_PHOTO", RECORD_SYS_ID: recordId })
                .then(function () {
                    if (imageName) { DavApi.deleteFile("gallery-image", imageName).catch(function () { }); }
                    $("#image_gallery_delete_popup").modal("hide");
                    loadPhotos($("#gallery_id_hidden").val());
                })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        $(document).on("click", "#btn_edit_image", function () {
            $("#txt_caption").val($(this).data("caption"));
            $("#image_file_name_").val("");
            $("#radio_thumbnail_no").prop("checked", true);
        });
        $(document).on("click", "#btn_single_image_gallery_update", function () {
            // The database procedure UPDATE_GALLERY_PHOTO has no WHERE clause (it would change every photo),
            // so editing a single photo stays disabled until the database developer fixes it.
            alert("Editing a single photo is not available yet (pending database fix).");
        });
    </script>
</body>

</html>
