<!-- No DOCTYPE on purpose: the live View Transfer Certificate page renders in browser "quirks mode" and its table/form heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        /* messages such as "No Data Found" are centered in their row */
        #view_Table0 tbody td[colspan] { text-align: center; }
    </style>
</head>

<body>
    <div id="header"></div>

<div class="container-fluid">
    <ul class="nav navbar-nav breadcrumb_ul res_breadcrum">
        <li>
            <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
            <a href="">Dashboard&nbsp;<span>/</span></a>
            <a href="" style="font-weight:bold">View Transfer Certificate</a>
        </li>
    </ul>
</div><br>
<input type="hidden" id="record_sys_id_hidden">
<input type="hidden" id="registration_no_hiden">
<div class="container-fluid padding-11" style="padding-bottom: 80px;">
    <div class="row">
        <div id="tc_view" class="matrix_tableView table-responsive viewVideo-table">
    </div>
    </div>
</div>
<div class="modal fade" id="record_delete_popup" style="z-index: 1111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title"> Record Delete</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label>Are you sure you want to Delete this record ?</label><br>
                <button id="btn_delete_record_yes" class="btn btn-success">
                    <i class="fa fa-check"></i>Yes
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="record_update_popup" style="z-index: 111111111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Update Transfer Certificate Record</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <form id="frm_update_records" onsubmit="return false;">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="name">Registration No</label>
                                <input class="form-control text-box single-line" id="txt_registration_no" name="REGISTRATION_NO" placeholder="Registration No" readonly="readonly" type="text" value="">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="location">Student Name</label>
                                <input autofocus="true" class="form-control text-box single-line" id="txt_student_name" name="STUDENT_NAME" placeholder="Student Name" required="true" type="text" value="">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Class<span style="color:red">*</span>:</label>
                                <select id="ddl_select_class" class="form-control">
                                    <option value="0">Select Class</option>
                                    <option value="I">I</option>
                                    <option value="II">II</option>
                                    <option value="III">III</option>
                                    <option value="IV">IV</option>
                                    <option value="V">V</option>
                                    <option value="VI">VI</option>
                                    <option value="VII">VII</option>
                                    <option value="VIII">VIII</option>
                                    <option value="IX">IX</option>
                                    <option value="X">X</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Date Of Issue<span style="color:red">*</span>:</label>
                                <input class="form-control datepickers text-box single-line" id="txt_issue_date" name="DATEOFISSUE" placeholder="Enter  date" type="date" value="">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-7">
                            <div class="form-group">
                                <label for="uploadimg">Upload File(only PDF)</label>
                                <input type="file" accept=".pdf" name="transfercertificate_file" class="form-control" id="transfercertificate_file_name_upload">
                            </div>
                        </div>
                    </div>
                </form>
                <button id="btn_update_records" class="btn btn-primary">
                    <i class="fa fa-save"></i> Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="archive_popup" style="z-index: 11111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Archive Record</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Select Session Year:</label><span style="color:red">*</span>
                        <select class="form-control" id="ddl_finyear">
                            <option value="0">-Select-</option>
                            <option value="2020-2021">2020-2021</option>
                            <option value="2021-2022">2021-2022</option>
                            <option value="2022-2023">2022-2023</option>
                            <option value="2023-2024">2023-2024</option>
                            <option value="2024-2025">2024-2025</option>
                            <option value="2025-2026">2025-2026</option>
                            <option value="2026-2027">2026-2027</option>
                            <option value="2027-2028">2027-2028</option>
                            <option value="2028-2029">2028-2029</option>
                            <option value="2029-2030">2029-2030</option>
                        </select>
                    </div>
                </div>
                <button id="btn_archive_record_save" class="btn btn-success">
                    <i class="fa fa-save"></i> Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // "16 Mar 26" / "2026-03-16" / "16-03-2026"  ->  "2026-03-16" (value for <input type="date">)
        function toInputDate(value) {
            var text = String(value || "").trim();
            var m, y, mo, d;
            if ((m = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]*(\d{2,4})/))) { d = +m[1]; mo = MONTHS.map(function (x) { return x.toLowerCase(); }).indexOf(m[2].slice(0, 3).toLowerCase()) + 1; y = +m[3]; }
            else return "";
            if (y < 100) y += 2000;
            if (!mo || !d) return "";
            return y + "-" + (mo < 10 ? "0" : "") + mo + "-" + (d < 10 ? "0" : "") + d;
        }

        // dates are shown like the live site: 16 Mar 26
        function showDate(value) {
            var iso = toInputDate(value);
            if (!iso) return String(value == null ? "" : value);
            var p = iso.split("-");
            return p[2] + " " + MONTHS[+p[1] - 1] + " " + p[0].slice(-2);
        }

        var HEAD = '<table class="table tc_table" id="view_Table0"><thead><tr><th>Sl.No.</th><th>Student Name</th><th>Registration No.</th><th>Class</th><th>Date of Issue</th><th>Actions</th></tr></thead><tbody>';

        /* ---------- list ---------- */
        function loadCertificates() {
            var box = $("#tc_view");
            DavApi.get("api-get-view-transfer-certificate?ITEM=VIEW_ALL")
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = HEAD;
                    if (!rows.length) html += '<tr><td colspan="6">No Data Found</td></tr>';
                    rows.forEach(function (t, i) {
                        var attrs = ' data-record_sys_id="' + esc(t.RECORD_SYS_ID) + '" data-student_name="' + esc(t.STUDENT_NAME) + '" data-registration_no="' + esc(t.REGISTRATION_NO) +
                            '" data-class_="' + esc(t.CLASS) + '" data-filename_="' + esc(t.FILE_NAME) + '" data-date="' + esc(t.DATE_OF_ISSUE) + '"';
                        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(t.STUDENT_NAME) + '</td><td>' + esc(t.REGISTRATION_NO) + '</td><td>' + esc(t.CLASS) + '</td><td>' + esc(showDate(t.DATE_OF_ISSUE)) + '</td><td>' +
                            '<button type="button" data-toggle="modal" data-target="#record_update_popup" id="btn_edit_record" title="Edit" class="btn btn-primary"' + attrs + '>Edit</button>&nbsp;' +
                            '<button type="button" id="btn_delete_record" data-toggle="modal" data-target="#record_delete_popup" title="Delete" class="btn btn-danger"' + attrs + '>Delete</button>&nbsp;' +
                            '<button type="button" data-toggle="modal" data-target="#archive_popup" id="btn_archive" title="archive" class="btn btn-dark"' + attrs + '>Archive</button>&nbsp;' +
                            '<button class="btn btn-info" type="button" id="btn_download_tc" title="Download"' + attrs + '>View</button>' +
                            '</td></tr>';
                    });
                    box.html(html + '</tbody></table>');
                })
                .catch(function (error) {
                    console.error("Transfer certificate list error:", error);
                    box.html(HEAD + '<tr><td colspan="6">Unable to load data.</td></tr></tbody></table>');
                });
        }
        $(loadCertificates);

        /* ---------- view file ---------- */
        $(document).on("click", "#btn_download_tc", function () {
            var file = $(this).data("filename_");
            if (!file) { alert("File not available."); return; }
            window.open("/Uploadfiles/TransferCertificateFiles/" + encodeURIComponent(file), "_blank");
        });

        /* ---------- delete ---------- */
        $(document).on("click", "#btn_delete_record", function () { $("#registration_no_hiden").val($(this).data("registration_no")); });
        $(document).on("click", "#btn_delete_record_yes", function () {
            var reg = $("#registration_no_hiden").val();
            DavApi.post("api-post-add-update-transfer-certificate", { ITEM: "DELETE_TRANSFER_CERTIFICATE", REGISTRATION_NO: reg, TITLE: reg })
                .then(function () { alert("Record deleted successfully."); $("#record_delete_popup").modal("hide"); loadCertificates(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- archive ---------- */
        $(document).on("click", "#btn_archive", function () { $("#registration_no_hiden").val($(this).data("registration_no")); $("#ddl_finyear").val("0"); });
        $(document).on("click", "#btn_archive_record_save", function () {
            var year = $("#ddl_finyear option:selected").val();
            if (year === "0") { alert("Session Year Is Required"); return false; }
            var reg = $("#registration_no_hiden").val();
            DavApi.post("api-post-add-update-transfer-certificate-archive", { ITEM: "ARCHIVE_TRANSFER_CERTIFICATE", REGISTRATION_NO: reg, TITLE: reg, SESSION_YEAR: year })
                .then(function () { alert("Record archived successfully."); $("#archive_popup").modal("hide"); loadCertificates(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- edit ---------- */
        var editFileName = "";
        $(document).on("keyup", "#txt_student_name", function () {
            // first letter of every word in capitals (same as the live site)
            $(this).val($(this).val().replace(/^(.)|\s(.)/g, function (s) { return s.toUpperCase(); }));
        });
        $(document).on("click", "#btn_edit_record", function () {
            var b = $(this);
            $("#txt_registration_no").val(b.data("registration_no"));
            $("#txt_student_name").val(b.data("student_name"));
            $("#ddl_select_class").val(String(b.data("class_") || "0"));
            $("#txt_issue_date").val(toInputDate(b.data("date")));
            $("#transfercertificate_file_name_upload").val("");
            editFileName = b.data("filename_") || "";
        });

        $(document).on("click", "#btn_update_records", async function () {
            var button = this;
            var name = $("#txt_student_name").val().trim();
            var cls = $("#ddl_select_class").val();
            var issue = $("#txt_issue_date").val();
            var file = $("#transfercertificate_file_name_upload")[0].files[0];

            if (!name) { alert("Please enter student name."); return false; }
            if (cls === "0") { alert("Please select class."); return false; }
            if (!issue) { alert("Please select date of issue."); return false; }
            if (file) {
                if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { alert("Please upload a PDF file only."); return false; }
                if (file.size >= 5 * 1024 * 1024) { alert("PDF file size must be less than 5 MB."); return false; }
            }

            try {
                await DavApi.busy(button, async function () {
                    var fileName = editFileName;
                    if (file) { fileName = (await DavApi.upload("transfer-certificate", [file]))[0].fileName; }
                    var reg = $("#txt_registration_no").val();

                    // ADD_UPDATE with an existing registration no updates that certificate
                    await DavApi.post("api-post-add-update-transfer-certificate", {
                        ITEM: "ADD_UPDATE",
                        RECORD_SYS_ID: 0,
                        REGISTRATION_NO: reg,
                        TITLE: reg,
                        STUDENT_NAME: name,
                        CLASS: cls,
                        FILE_NAME: fileName,
                        DATE_OF_ISSUE: issue
                    });
                });
                alert("Record updated successfully.");
                $("#record_update_popup").modal("hide");
                loadCertificates();
            } catch (e) {
                alert(e.message || "Oops!...Something went wrong");
            }
        });
    </script>
</body>

</html>
