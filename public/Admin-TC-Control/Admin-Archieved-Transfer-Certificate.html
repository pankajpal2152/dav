<!-- No DOCTYPE on purpose: the live TC archived-details page renders in browser "quirks mode" and its table/form heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        /* messages such as "No Data Found" are centered in their row */
        #view_Table1 tbody td[colspan] { text-align: center; }
    </style>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul res_breadcrum">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">View Archived Details</a>
            </li>
        </ul>
    </div><br>
    <div class="container-fluid padding-11">
        <input type="hidden" id="registration_no_hidden">
        <div class="container-fluid">
            <label class="ml-3">Select Session Year:</label><span style="color:red">*</span>
            <div class="form-row">
                <div class="col-md-3">
                    <select class="form-control ml-3" id="ddl_archive_finyear">
                        <option value="0">-Select-</option>
                        <option value="2020-2021">2020-2021</option>
                        <option value="2021-2022">2021-2022</option>
                        <option value="2022-2023">2022-2023</option>
                        <option value="2023-2024">2023-2024</option>
                        <option value="2024-2025">2024-2025</option>
                        <option value="2025-2026">2025-2026</option>
                        <option value="2026-2027">2026-2027</option>
                        <option value="2027-2028">2027-2028</option>
                        <option value="2028-2029">2028-2029</option>
                        <option value="2029-2030">2029-2030</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary ml-4 btn_1" id="btn_search_archive">Search</button>
            </div><br>
            <div class="row">
                <div id="archive_view" class="table-responsive table-hover NoticeBoard-Table ">
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="record_unarchive_popup" style="position: absolute; z-index: 1111111111111111111111;">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header" style="padding: 4px 10px;font-weight: bold;color: #158684;">
                    <h4 class="modal-title" style="font-size: 16px;">Unarchive Record</h4>
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <label>Are you sure you want to unarchive this record ?</label><br>
                    <button id="btn_unarchive_record_yes" class="btn btn-success">
                        <i class="fa fa-check"></i>Yes
                    </button>
                    <button class="btn btn-danger" data-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // dates are shown like the live site: 16 Mar 26
        function showDate(value) {
            var text = String(value == null ? "" : value).trim();
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            var m, y, mo, d;
            if ((m = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]*(\d{2,4})/))) { d = +m[1]; mo = months.map(function (x) { return x.toLowerCase(); }).indexOf(m[2].slice(0, 3).toLowerCase()) + 1; y = +m[3]; }
            else return text;
            if (!mo || !d) return text;
            return (d < 10 ? "0" : "") + d + " " + months[mo - 1] + " " + String(y).slice(-2);
        }

        var HEAD = '<table class="table tc_table" id="view_Table1"><thead><tr><th>Sl.No.</th><th>Student Name</th><th>Registration No.</th><th>Class</th><th>Date of Issue</th><th>Actions</th></tr></thead><tbody>';

        function loadArchived(sessionYear) {
            var box = $("#archive_view");
            DavApi.get("api-get-view-archive-transfer-certificate?ITEM=VIEW_ALL&SESSION_YEAR=" + encodeURIComponent(sessionYear))
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = HEAD;
                    if (!rows.length) html += '<tr><td colspan="6">No Data Found</td></tr>';
                    rows.forEach(function (t, i) {
                        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(t.STUDENT_NAME) + '</td><td>' + esc(t.REGISTRATION_NO) + '</td><td>' + esc(t.CLASS) + '</td><td>' + esc(showDate(t.DATE_OF_ISSUE)) + '</td><td>' +
                            '<button type="button" data-toggle="modal" data-target="#record_unarchive_popup" id="btn_unarchive" title="UnArchive" class="btn archive"' +
                            ' data-record_sys_id="' + esc(t.RECORD_SYS_ID) + '" data-student_name="' + esc(t.STUDENT_NAME) + '" data-registration_no="' + esc(t.REGISTRATION_NO) +
                            '" data-class_="' + esc(t.CLASS) + '" data-filename_="' + esc(t.FILE_NAME) + '">' +
                            '<i class="fa fa-archive" aria-hidden="true"></i>Unarchive</button></td></tr>';
                    });
                    box.html(html + '</tbody></table>');
                })
                .catch(function () {
                    box.html(HEAD + '<tr><td colspan="6">No Data Found</td></tr></tbody></table>');
                });
        }

        $(document).on("click", "#btn_search_archive", function () {
            var year = $("#ddl_archive_finyear option:selected").val();
            if (year === "0") { alert("Select Session Year Properly"); return false; }
            loadArchived(year);
        });

        $(document).on("click", "#btn_unarchive", function () {
            $("#registration_no_hidden").val($(this).data("registration_no"));
        });

        $(document).on("click", "#btn_unarchive_record_yes", function () {
            var year = $("#ddl_archive_finyear option:selected").val();
            var reg = $("#registration_no_hidden").val();
            DavApi.post("api-post-add-update-transfer-certificate-unarchive", {
                ITEM: "UNARCHIVE_TRANSFER_CERTIFICATE",
                REGISTRATION_NO: reg,
                TITLE: reg,
                SESSION_YEAR: year
            })
                .then(function () {
                    alert("Record unarchived successfully.");
                    $("#record_unarchive_popup").modal("hide");
                    loadArchived(year);
                })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });
    </script>
</body>

</html>
