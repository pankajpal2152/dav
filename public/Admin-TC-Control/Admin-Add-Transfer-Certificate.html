<!-- No DOCTYPE on purpose: the live Add Transfer Certificate page renders in browser "quirks mode" and its form/input heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
</head>

<body>
    <div id="header"></div>

<div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">Add Transfer Certificate</a>
            </li>
        </ul>
    </div>
<!-- form start -->
    <div class="container-fluid" style="padding-bottom: 80px;">
        <div id="div_tc_details" class="row addTransfarForm">
            <div class="matrix_tableView">
                <div class="modal-body">
                    <form action="/" enctype="multipart/form-data" id="transform_certificate_form" method="post" onsubmit="return false;">
                        <div class="form-row">
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Date of Issue<span style="color:red">*</span>:</label>
                                <input type="date" name="date" class="form-control" id="txt_issue_date">
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Registration No.<span style="color:red">*</span>:</label>
                                <input class="form-control text-box single-line" id="txt_registration_no" name="REGISTRATION_NO" placeholder="Enter Registration No" type="text" value="">
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Student Name<span style="color:red">*</span>:</label>
                                <input class="form-control text-box single-line" id="txt_student_name" name="STUDENT_NAME" placeholder="Enter Student Name" type="text" value="">
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Class<span style="color:red">*</span>:</label>
                                <select id="ddl_select_class" class="form-control">
                                    <option value="0">Select Class</option>
                                    <option value="I">Class I</option>
                                    <option value="II">Class II</option>
                                    <option value="III">Class III</option>
                                    <option value="IV">Class IV</option>
                                    <option value="V">Class V</option>
                                    <option value="VI">Class VI</option>
                                    <option value="VII">Class VII</option>
                                    <option value="VIII">Class VIII</option>
                                    <option value="IX">Class IX</option>
                                    <option value="X">Class X</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-md-4 p-0 mt-3">
                                <label>Upload Transfer Certificate (.PDF and less than 5MB)<span style="color:red">*</span>:</label>
                                <input type="file" name="transfercertificate_file" accept=".pdf" class="form-control" id="transfercertificate_file_name">
                            </div>
                        </div>
                        <div class="form-group">
                            <button type="button" class="btn btn-primary" id="btn_save_transfer_certificate">
                                <i class="fa fa-save"></i> Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        $("#btn_save_transfer_certificate").on("click", async function () {
            var button = this;
            var issue = $("#txt_issue_date").val();
            var registrationNo = $("#txt_registration_no").val().trim();
            var studentName = $("#txt_student_name").val().trim();
            var selectedClass = $("#ddl_select_class").val();
            var file = $("#transfercertificate_file_name")[0].files[0];

            if (!issue) { alert("Please select date of issue."); $("#txt_issue_date").focus(); return; }
            if (!registrationNo) { alert("Please enter registration no."); $("#txt_registration_no").focus(); return; }
            if (!studentName) { alert("Please enter student name."); $("#txt_student_name").focus(); return; }
            if (selectedClass === "0") { alert("Please select class."); $("#ddl_select_class").focus(); return; }
            if (!file) { alert("Please upload transfer certificate."); return; }
            if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { alert("Please upload a PDF file only."); return; }
            if (file.size >= 5 * 1024 * 1024) { alert("PDF file size must be less than 5 MB."); return; }
            if (!DavApi.requireLogin()) return;

            try {
                await DavApi.busy(button, async function () {
                    var uploaded = await DavApi.upload("transfer-certificate", [file]);

                    await DavApi.post("api-post-add-update-transfer-certificate", {
                        ITEM: "ADD_UPDATE",
                        RECORD_SYS_ID: 0,
                        REGISTRATION_NO: registrationNo,
                        TITLE: registrationNo,
                        STUDENT_NAME: studentName,
                        CLASS: selectedClass,
                        FILE_NAME: uploaded[0].fileName,
                        DATE_OF_ISSUE: issue
                    });
                });

                alert("Transfer certificate saved successfully.");
                window.location.reload();
            } catch (error) {
                console.error("Save transfer certificate error:", error);
                alert(error.message || "Unable to save transfer certificate.");
            }
        });
    </script>
</body>

</html>
