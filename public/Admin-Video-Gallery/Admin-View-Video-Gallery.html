<!-- No DOCTYPE on purpose: the live View Video Gallery page renders in browser "quirks mode" and its table/form heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        /* Column widths of the live Video Gallery table (Sl.No. / Title / Description / Url / Actions) */
        #view_Table { table-layout: fixed; }
        #view_Table th:nth-child(1) { width: 6.13%; }
        #view_Table th:nth-child(2) { width: 39.39%; }
        #view_Table th:nth-child(3) { width: 8.74%; }
        #view_Table th:nth-child(4) { width: 33.6%; }
        #view_Table th:nth-child(5) { width: 12.14% !important; }
        /* Sl.No. numbers sit at the left of their column on the live page */
        #view_Table tbody td:first-child:not([colspan]) { text-align: left; padding-left: 20px; }
        #view_Table tbody td[colspan] { text-align: center; }
        /* long urls / titles must wrap inside their fixed column */
        #view_Table td { word-wrap: break-word; overflow-wrap: anywhere; }
    </style>
</head>

<body>
    <div id="header"></div>

<div class="container-fluid">
    <ul class="nav navbar-nav breadcrumb_ul res_breadcrum">
        <li>
            <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
            <a href="">Dashboard&nbsp;<span>/</span></a>
            <a href="" style="font-weight:bold">View Video Gallery</a>
        </li>
    </ul>
</div>
<input type="hidden" id="title_name_hidden_vg">
<br>
<div class="container-fluid padding-11">
    <div class="row">
        <div id="view_video_gallery" class="table-responsive viewVideoGallery-table space-bottom">
        </div>
    </div>
</div>
<div class="modal fade" id="archive_vg_popup" style="position: absolute; z-index: 11111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Archive Record</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label>Select Session Year:</label><span style="color:red">*</span>
                <select class="form-control" id="ddl_finyear">
                    <option value="0">-Select-</option>
                    <option value="2020-2021">2020-2021</option>
                    <option value="2021-2022">2021-2022</option>
                    <option value="2022-2023">2022-2023</option>
                    <option value="2023-2024">2023-2024</option>
                    <option value="2024-2025">2024-2025</option>
                    <option value="2025-2026">2025-2026</option>
                    <option value="2026-2027">2026-2027</option>
                    <option value="2027-2028">2027-2028</option>
                    <option value="2028-2029">2028-2029</option>
                    <option value="2029-2030">2029-2030</option>
                </select><br>
                <button id="btn_archive_record_save" class="btn btn-success">
                    <i class="fa fa-save"></i> Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="record_delete_video_gallery_popup">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Record Delete</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label>Are you sure you want to delete this record ?</label><br>
                <button id="btn_delete_video_gallery_yes" class="btn btn-success">
                    <i class="fa fa-check"></i> Yes
                </button>
                <button class="btn btn-danger" data-dismiss="modal"><i class="fa fa-times" aria-hidden="true"></i> No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="record_update_video_popup" style="position: absolute; z-index: 1111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Update Video Gallery Record</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <form id="frm_update_records_gallery" class="col-lg-12 col-sm-12" onsubmit="return false;">
                    <div class="form-group">
                        <label for="name">Title</label>
                        <input class="form-control text-box single-line" id="txt_title" name="TITLE" placeholder="Enter Title" readonly="readonly" type="text" value="">
                    </div>
                    <div class="form-group">
                        <label for="location">Description</label>
                        <input autofocus="true" class="form-control text-box single-line" id="txt_desc" name="DESCRIPTION" placeholder="Enter Description" required="true" type="text" value="">
                    </div>
                    <div class="form-group">
                        <label for="urlview">Url</label>
                        <input autofocus="true" class="form-control text-box single-line" id="txt_url" name="URLLINK" placeholder="Enter Url" required="true" type="text" value="">
                    </div>
                </form>
                <button id="btn_update_video_gallery" class="btn btn-success ml-3">
                    <i class="fa fa-save"></i>&nbsp; Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div id="video_gallery_popup" class="modal fade">
    <div class="modal-dialog" style="display: table !important;min-width: 50%;overflow: auto;">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">View Video</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body video-gallery-modal">
                <div class="row">
                    <div class="col-md-12">
                        <div class="video-container" id="video_div">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        var HEAD = '<table class="table vg_table" id="view_Table"><thead><tr><th>Sl.No.</th><th>Title</th><th>Description</th><th>Url</th><th>Actions</th></tr></thead><tbody>';

        /* ---------- list ---------- */
        function loadVideos() {
            var box = $("#view_video_gallery");
            DavApi.get("api-get-view-gallery-video?ITEM=VIEW_ALL")
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = HEAD;
                    if (!rows.length) html += '<tr><td colspan="5">No Data Found</td></tr>';
                    rows.forEach(function (v, i) {
                        var attrs = ' data-description="' + esc(v.DESCRIPTION) + '" data-title="' + esc(v.TITLE) + '" data-url_data="' + esc(v.URL) + '"';
                        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(v.TITLE) + '</td><td>' + esc(v.DESCRIPTION) + '</td><td>' + esc(v.URL) + '</td><td>' +
                            '<button type="button" data-toggle="modal" data-target="#record_update_video_popup" id="btn_edit_record" title="Edit" class="btn btn-primary"' + attrs + '>Edit</button>&nbsp;' +
                            '<button type="button" id="btn_delete_vg_record" data-toggle="modal" data-target="#record_delete_video_gallery_popup" title="Delete" class="btn btn-danger"' + attrs + '>Delete</button>&nbsp;' +
                            '<button type="button" data-toggle="modal" data-target="#archive_vg_popup" id="btn_vg_archive" title="archive" class="btn btn-dark"' + attrs + '>Archive</button>&nbsp;' +
                            '<button type="button" id="btn_view_video_gallery" data-toggle="modal" data-target="#video_gallery_popup" class="btn btn-info" title="View"' + attrs + '>View</button>' +
                            '</td></tr>';
                    });
                    box.html(html + '</tbody></table>');
                })
                .catch(function (error) {
                    console.error("Video list error:", error);
                    box.html(HEAD + '<tr><td colspan="5">Unable to load data.</td></tr></tbody></table>');
                });
        }
        $(loadVideos);

        /* ---------- view video ---------- */
        function embedUrl(link) {
            link = String(link || "");
            var m = link.match(/youtu\.be\/([\w-]+)/);
            if (m) return "https://www.youtube.com/embed/" + m[1];
            return link.replace("watch?v=", "embed/");
        }
        $(document).on("click", "#btn_view_video_gallery", function () {
            $("#video_div").html('<iframe src="' + esc(embedUrl($(this).data("url_data"))) + '" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>');
        });
        $("#video_gallery_popup").on("hidden.bs.modal", function () { $("#video_div").html(""); }); // stop playback on close

        /* ---------- edit ---------- */
        $(document).on("click", "#btn_edit_record", function () {
            $("#txt_title").val($(this).data("title"));
            $("#txt_desc").val($(this).data("description"));
            $("#txt_url").val($(this).data("url_data"));
        });
        $(document).on("click", "#btn_update_video_gallery", function () {
            var desc = $("#txt_desc").val().trim();
            var url = $("#txt_url").val().trim();
            if (!desc || !url) { alert("All Fields Is required"); return false; }
            // an ADD with an existing title updates that video's description and url
            DavApi.post("api-post-add-update-video-gallery", { ITEM: "ADD", RECORD_SYS_ID: 0, TITLE: $("#txt_title").val(), DESCRIPTION: desc, URL: url, STATUS: "ACTIVE" })
                .then(function () { alert("Record updated successfully."); $("#record_update_video_popup").modal("hide"); loadVideos(); })
                .catch(function (e) { alert(e.message || "Something went wrong"); });
        });

        /* ---------- delete ---------- */
        $(document).on("click", "#btn_delete_vg_record", function () { $("#title_name_hidden_vg").val($(this).data("title")); });
        $(document).on("click", "#btn_delete_video_gallery_yes", function () {
            DavApi.post("api-post-add-update-video-gallery", { ITEM: "DELETE_VIDEO_GALLERY", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden_vg").val() })
                .then(function () { alert("Record deleted successfully."); $("#record_delete_video_gallery_popup").modal("hide"); loadVideos(); })
                .catch(function (e) { alert(e.message || "oops something went wrong"); });
        });

        /* ---------- archive ---------- */
        $(document).on("click", "#btn_vg_archive", function () { $("#title_name_hidden_vg").val($(this).data("title")); $("#ddl_finyear").val("0"); });
        $(document).on("click", "#btn_archive_record_save", function () {
            var year = $("#ddl_finyear option:selected").val();
            if (year === "0") { alert("Session Year Is Required"); return false; }
            DavApi.post("api-post-add-update-video-gallery-archive", { ITEM: "ARCHIVE_VIDEO_GALLERY", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden_vg").val(), SESSION_YEAR: year })
                .then(function () { alert("Video Archive Successful"); $("#archive_vg_popup").modal("hide"); loadVideos(); })
                .catch(function (e) { alert(e.message || "oops something went wrong"); });
        });
    </script>
</body>

</html>
