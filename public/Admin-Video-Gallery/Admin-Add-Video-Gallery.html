<!-- No DOCTYPE on purpose: the live Add Video Gallery page renders in browser "quirks mode" and its form/input heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">Add Video Gallery</a>
            </li>
        </ul>
    </div>
    <!-- form start -->
    <div class="container-fluid" style="padding-bottom: 80px;">
        <div id="div_videogallery_details" class="row addTransfarForm">
            <div class="matrix_tableView">
                <div class="modal-body">
                    <form action="/" enctype="multipart/form-data" id="add_video_gallery_form" method="post" onsubmit="return false;">
                        <div class="form-row">
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Title<span style="color:red">*</span>:</label>
                                <input class="form-control text-box single-line" id="txt_title" maxlength="100" name="TITLE" placeholder="Enter  Title" type="text" value="">
                                <label style="color:blue">Character:</label><label style="color:blue" id="title_txt_count">100</label>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Description<span style="color:red">*</span>:</label>
                                <textarea id="txt_description" class="form-control" name="nb_description" maxlength="200" placeholder="Enter Description"></textarea>
                                <label style="color:blue">Character:</label><label style="color:blue" id="description_txt_count">200</label>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Url<span style="color:red">*</span>:</label>
                                <input class="form-control text-box single-line" id="txt_video_url" name="URLLINK" placeholder="Enter Video Url" type="text" value="">
                            </div>
                            <div class="col-md-3">
                                <div class="info-btn-conatiner">
                                    <a href="/Assest/help_pdf/Process of uploading video files from Google Drive.pdf" download="Process of uploading video files from Google Drive"><span><i class="fa fa-question-circle" aria-hidden="true"></i></span><span class="hover-help">Help</span></a>
                                </div>
                            </div>
                        </div><br>
                        <div class="form-group">
                            <button type="button" class="btn btn-primary" id="btn_save_video_gallery">
                                <i class="fa fa-save"></i> Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        // "Character:" counters (count down from the field's maximum length)
        $("#txt_title").on("input keyup paste", function () {
            $("#title_txt_count").text(100 - $(this).val().length);
        });
        $("#txt_description").on("input keyup paste", function () {
            $("#description_txt_count").text(200 - $(this).val().length);
        });

        $("#btn_save_video_gallery").on("click", async function () {
            var button = this;
            var title = $("#txt_title").val().trim();
            var description = $("#txt_description").val().trim();
            var url = $("#txt_video_url").val().trim();

            if (!title) { alert("Please enter title."); $("#txt_title").focus(); return; }
            if (!description) { alert("Please enter description."); $("#txt_description").focus(); return; }
            if (!url) { alert("Please enter video URL."); $("#txt_video_url").focus(); return; }
            try { new URL(url); } catch (e) { alert("Please enter a valid video URL."); $("#txt_video_url").focus(); return; }

            if (!DavApi.requireLogin()) return;

            try {
                await DavApi.busy(button, async function () {
                    await DavApi.post("api-post-add-update-video-gallery", {
                        ITEM: "ADD",
                        RECORD_SYS_ID: 0,
                        TITLE: title,
                        DESCRIPTION: description,
                        URL: url,
                        STATUS: "ACTIVE"
                    });
                });

                alert("Video saved successfully.");
                window.location.reload();
            } catch (error) {
                console.error("Save video error:", error);
                alert(error.message || "Unable to save video.");
            }
        });
    </script>
</body>

</html>
