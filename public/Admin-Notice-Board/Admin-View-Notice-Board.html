<!-- No DOCTYPE on purpose: the live NoticeBoard page renders in browser "quirks mode" and its table/form heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        /* messages such as "No Data Found" are centered in their row */
        #view_Table tbody td[colspan] { text-align: center; }
    </style>
</head>

<body>
    <div id="header"></div>

<div class="container-fluid">
    <ul class="nav navbar-nav breadcrumb_ul">
        <li>
            <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
            <a href="">Dashboard&nbsp;<span>/</span></a>
            <a href="" style="font-weight:bold">NoticeBoard</a>
        </li>
    </ul>
</div>
<input type="hidden" id="title_name_hidden">
<br>
            <div class="container-fluid padding-11" style="padding-bottom: 80px;">
                <div class="row">
                    <div id="noticeboard_view" class="matrix_tableView NoticeBoard-Table">
        </div>
                </div>
            </div>
<div class="modal fade" id="record_delete_popup">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Record Delete</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label>Are you sure you want to delete this record ?</label><br>
                <button id="btn_delete_noticeboard_yes" class="btn btn-success">
                    <i class="fa fa-check"></i>Yes
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="archive_popup" style="">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Archive Record</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label>Select Session Year:</label><span style="color:red">*</span>
                <select class="form-control" id="ddl_finyear">
                    <option value="0">-Select-</option>
                    <option value="2020-2021">2020-2021</option>
                    <option value="2021-2022">2021-2022</option>
                    <option value="2022-2023">2022-2023</option>
                    <option value="2023-2024">2023-2024</option>
                    <option value="2024-2025">2024-2025</option>
                    <option value="2025-2026">2025-2026</option>
                    <option value="2026-2027">2026-2027</option>
                    <option value="2027-2028">2027-2028</option>
                    <option value="2028-2029">2028-2029</option>
                    <option value="2029-2030">2029-2030</option>
                </select><br>
                <button id="btn_archive_nb_record_save" class="btn btn-success">
                    <i class="fa fa-save"></i>Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="record_update_popup" style="position: absolute; z-index: 1111111111111111;">
    <div class="modal-dialog">
        <div class="modal-content" style="max-width: 700px;">
            <!-- Modal Header -->
            <div class="modal-header sub-header">
                <h4 class="modal-title">Update NoticeBoard Records</h4>
                <button type="button" class="close" data-dismiss="modal">×</button>
            </div>
            <!-- Modal body -->
            <div class="modal-body" style="padding: 8px 10px;">
                <form id="frm_update_records_nb" class="col-lg-12 col-sm-12" onsubmit="return false;">
                    <div class="form-group">
                        <label for="name">Title<span style="color:red">*</span>:</label>
                        <input class="form-control text-box single-line" id="txt_title" name="TITLE" placeholder="Enter Title" readonly="readonly" type="text" value="">
                    </div>
                    <div class="form-group">
                        <label for="location">Description<span style="color:red">*</span>:</label>
                        <input autofocus="true" class="form-control text-box single-line" id="txt_desc" name="DESCRIPTION" placeholder="Enter Description" required="true" type="text" value="">
                    </div>
                    <div class="form-group">
                        <label>Date of Issue<span style="color:red">*</span>:</label>
                        <input type="date" name="date" class="form-control" id="txt_issue_date">
                    </div>
                    <div class="form-group">
                        <label>Date of Expiry<span style="color:red">*</span>:</label>
                        <input type="date" name="date" class="form-control" id="txt_expiry_date">
                    </div>
                    <div class="form-group">
                        <label for="uploadimg">Upload File(only PDF)</label>
                        <input type="file" accept=".pdf" name="noticeboard_file" class="form-control" id="noticeboard_file_name">
                    </div>
                    <div class="form-group">
                        <label>Show in Home Page:</label>
                        <input type="checkbox" style="height:19px; width:45px;" id="chkbox_show_home_page_update">
                    </div>
                 </form>
                <button id="btn_update_records_nb" class="btn btn-primary ml-3">
                    <i class="fa fa-save"></i> &nbsp; Save
                </button>
                <button class="btn btn-danger" data-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // "03 Sep 26" / "2026-09-03" / "03-09-2026"  ->  "2026-09-03" (value for <input type="date">)
        function toInputDate(value) {
            var text = String(value || "").trim();
            var months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
            var m, y, mo, d;
            if ((m = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else if ((m = text.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]*(\d{2,4})/))) { d = +m[1]; mo = months.indexOf(m[2].slice(0, 3).toLowerCase()) + 1; y = +m[3]; }
            else return "";
            if (y < 100) y += 2000;
            if (!mo || !d) return "";
            return y + "-" + (mo < 10 ? "0" : "") + mo + "-" + (d < 10 ? "0" : "") + d;
        }

        // dates are shown like the live site: 17 Aug 26
        function showDate(value) {
            var iso = toInputDate(value);
            if (!iso) return String(value == null ? "" : value);
            var p = iso.split("-");
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return p[2] + " " + months[+p[1] - 1] + " " + p[0].slice(-2);
        }

        var HEAD = '<table class="table table-condensed tc_table" id="view_Table"><thead><tr><th>Sl.No.</th><th>Title</th><th>Description</th><th>Issue Date</th><th>Expiry Date</th><th>Actions</th></tr></thead><tbody>';

        /* ---------- list ---------- */
        function loadNotices() {
            var box = $("#noticeboard_view");
            DavApi.get("api-get-view-notice-board?ITEM=VIEW_ALL")
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    var html = HEAD;
                    if (!rows.length) html += '<tr><td colspan="6">No Data Found</td></tr>';
                    rows.forEach(function (n, i) {
                        var attrs = ' data-description="' + esc(n.DESCRIPTION) + '" data-title="' + esc(n.TITLE) + '" data-date_of_issue="' + esc(n.DATE_OF_ISSUE) +
                            '" data-date_of_expiry="' + esc(n.DATE_OF_EXPIRY) + '" data-filename_="' + esc(n.FILE_NAME) + '" data-highlight_homepage="' + esc(n.HIGHLIGHT_HOMEPAGE || "") + '"';
                        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(n.TITLE) + '</td><td>' + esc(n.DESCRIPTION) + '</td><td>' + esc(showDate(n.DATE_OF_ISSUE)) + '</td><td>' + esc(showDate(n.DATE_OF_EXPIRY)) + '</td><td>' +
                            '<button type="button" data-toggle="modal" data-target="#record_update_popup" id="btn_edit_record" title="Edit" class="btn btn-primary"' + attrs + '>Edit</button>&nbsp;' +
                            '<button type="button" id="btn_delete_nb_record" data-toggle="modal" data-target="#record_delete_popup" title="Delete" class="btn btn-danger"' + attrs + '>Delete</button>&nbsp;' +
                            '<button type="button" data-toggle="modal" data-target="#archive_popup" id="btn_nb_archive" title="archive" class="btn btn-dark"' + attrs + '>Archive</button>&nbsp;&nbsp;' +
                            '<button class="btn btn-info" type="button" id="btn_download_nb" title="View file"' + attrs + '>View</button>' +
                            '</td></tr>';
                    });
                    box.html(html + '</tbody></table>');
                })
                .catch(function (error) {
                    console.error("Notice list error:", error);
                    box.html(HEAD + '<tr><td colspan="6">Unable to load data.</td></tr></tbody></table>');
                });
        }
        $(loadNotices);

        /* ---------- view file ---------- */
        $(document).on("click", "#btn_download_nb", function () {
            var file = $(this).data("filename_");
            if (!file) { alert("File not available."); return; }
            window.open("/Uploadfiles/NoticeBoardFiles/" + encodeURIComponent(file), "_blank");
        });

        /* ---------- delete ---------- */
        $(document).on("click", "#btn_delete_nb_record", function () { $("#title_name_hidden").val($(this).data("title")); });
        $(document).on("click", "#btn_delete_noticeboard_yes", function () {
            DavApi.post("api-post-add-update-notice-board", { ITEM: "DELETE_NOTICE_BOARD", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden").val() })
                .then(function () { alert("Record deleted successfully."); $("#record_delete_popup").modal("hide"); loadNotices(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- archive ---------- */
        $(document).on("click", "#btn_nb_archive", function () { $("#title_name_hidden").val($(this).data("title")); $("#ddl_finyear").val("0"); });
        $(document).on("click", "#btn_archive_nb_record_save", function () {
            var year = $("#ddl_finyear option:selected").val();
            if (year === "0") { alert("Session Year Is Required"); return false; }
            DavApi.post("api-post-add-update-notice-board-archive", { ITEM: "ARCHIVE_NOTICE_BOARD", RECORD_SYS_ID: 0, TITLE: $("#title_name_hidden").val(), SESSION_YEAR: year })
                .then(function () { alert("Information Archived Successfully"); $("#archive_popup").modal("hide"); loadNotices(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- edit ---------- */
        var editFileName = "";
        $(document).on("click", "#btn_edit_record", function () {
            var b = $(this);
            $("#txt_title").val(b.data("title"));
            $("#txt_desc").val(b.data("description"));
            $("#txt_issue_date").val(toInputDate(b.data("date_of_issue")));
            $("#txt_expiry_date").val(toInputDate(b.data("date_of_expiry")));
            $("#noticeboard_file_name").val("");
            $("#chkbox_show_home_page_update").prop("checked", b.data("highlight_homepage") === "Y");
            editFileName = b.data("filename_") || "";
        });

        $(document).on("click", "#btn_update_records_nb", async function () {
            var button = this;
            var desc = $("#txt_desc").val().trim();
            var issue = $("#txt_issue_date").val();
            var expiry = $("#txt_expiry_date").val();
            var file = $("#noticeboard_file_name")[0].files[0];

            if (!desc) { alert("Please enter description."); return false; }
            if (!issue) { alert("Please select date of issue."); return false; }
            if (!expiry) { alert("Please select date of expiry."); return false; }
            if (expiry < issue) { alert("Date of expiry cannot be before date of issue."); return false; }
            if (file) {
                if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { alert("Please upload a PDF file only."); return false; }
                if (file.size >= 5 * 1024 * 1024) { alert("PDF file size must be less than 5 MB."); return false; }
            }

            try {
                await DavApi.busy(button, async function () {
                    var fileName = editFileName;
                    if (file) { fileName = (await DavApi.upload("notice-board", [file]))[0].fileName; }

                    // an ADD with an existing title updates that notice
                    await DavApi.post("api-post-add-update-notice-board", {
                        ITEM: "ADD",
                        RECORD_SYS_ID: 0,
                        TITLE: $("#txt_title").val(),
                        DESCRIPTION: desc,
                        FILE_NAME: fileName,
                        DATE_OF_ISSUE: issue,
                        DATE_OF_EXPIRY: expiry,
                        STATUS: "ACTIVE",
                        HIGHLIGHT_HOMEPAGE: $("#chkbox_show_home_page_update").is(":checked") ? "Y" : "N"
                    });
                });
                alert("Record updated successfully.");
                $("#record_update_popup").modal("hide");
                loadNotices();
            } catch (e) {
                alert(e.message || "Oops!...Something went wrong");
            }
        });
    </script>
</body>

</html>
