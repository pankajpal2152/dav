<!-- No DOCTYPE on purpose: the live Add NoticeBoard page renders in browser "quirks mode" and its form/input heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">Add NoticeBoard</a>
            </li>
        </ul>
    </div>
    <!-- form start -->
    <div class="container-fluid" style="padding-bottom: 80px;">
        <div id="div_noticeboard" class="row addTransfarForm">
            <div class="matrix_tableView">
                <div class="modal-body">
                    <form action="/" enctype="multipart/form-data" id="noticeboard_details_form" method="post" onsubmit="return false;">
                        <div class="form-row">
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Title<span style="color:red">*</span>:</label>
                                <input autocomplete="off" class="form-control text-box single-line" id="txt_title" maxlength="200" name="TITLE" placeholder="Enter Title" type="text" value="">
                                <label style="color:blue">Character:</label><label style="color:blue" id="title_txt_count">200</label>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Description<span style="color:red">*</span>:</label>
                                <textarea id="txt_description" class="form-control" name="nb_description" maxlength="500" placeholder="Enter Description"></textarea>
                                <label style="color:blue">Character:</label><label style="color:blue" id="description_txt_count">500</label>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3 ">
                                <label>Date of Issue<span style="color:red">*</span>:</label>
                                <input type="date" name="date" class="form-control" id="txt_issue_date">
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Date of Expiry<span style="color:red">*</span>:</label>
                                <input type="date" name="date" data-date-format="DD MMMM YYYY" class="form-control" id="txt_expiry_date">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col-md-4 p-0 mt-3">
                                <label>Upload Notice File (.PDF and less than 5MB)<span style="color:red">*</span>:</label>
                                <input type="file" accept=".pdf" name="noticeboard_file" class="form-control" id="noticeboard_file_name">
                            </div>&nbsp;&nbsp;
                            <div class="col-md-4 p-0 mt-3">
                                <label>Show in Home Page:</label>
                                <input type="checkbox" id="chkbox_show_home_page">
                            </div>
                        </div><br>
                        <div class="form-group">
                            <button type="button" class="btn btn-primary" id="btn_save_noticeboard">
                                <i class="fa fa-save"></i> Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        // "Character:" counters (count down from the field's maximum length)
        $("#txt_title").on("input keyup paste", function () {
            $("#title_txt_count").text(200 - $(this).val().length);
        });
        $("#txt_description").on("input keyup paste", function () {
            $("#description_txt_count").text(500 - $(this).val().length);
        });

        $("#btn_save_noticeboard").on("click", async function () {
            var button = this;
            var title = $("#txt_title").val().trim();
            var description = $("#txt_description").val().trim();
            var issue = $("#txt_issue_date").val();
            var expiry = $("#txt_expiry_date").val();
            var file = $("#noticeboard_file_name")[0].files[0];
            var showHome = $("#chkbox_show_home_page").is(":checked");

            if (!title) { alert("Please enter title."); $("#txt_title").focus(); return; }
            if (!description) { alert("Please enter description."); $("#txt_description").focus(); return; }
            if (!issue) { alert("Please select date of issue."); $("#txt_issue_date").focus(); return; }
            if (!expiry) { alert("Please select date of expiry."); $("#txt_expiry_date").focus(); return; }
            if (expiry < issue) { alert("Date of expiry cannot be before date of issue."); $("#txt_expiry_date").focus(); return; }
            if (!file) { alert("Please upload notice file."); return; }
            if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { alert("Please upload a PDF file only."); return; }
            if (file.size >= 5 * 1024 * 1024) { alert("PDF file size must be less than 5 MB."); return; }
            if (!DavApi.requireLogin()) return;

            try {
                await DavApi.busy(button, async function () {
                    var uploaded = await DavApi.upload("notice-board", [file]);

                    await DavApi.post("api-post-add-update-notice-board", {
                        ITEM: "ADD",
                        RECORD_SYS_ID: 0,
                        TITLE: title,
                        DESCRIPTION: description,
                        FILE_NAME: uploaded[0].fileName,
                        DATE_OF_ISSUE: issue,
                        DATE_OF_EXPIRY: expiry,
                        STATUS: "ACTIVE",
                        HIGHLIGHT_HOMEPAGE: showHome ? "Y" : "N",
                        SESSION_YEAR: DavApi.sessionYear()
                    });
                });

                alert("Notice saved successfully.");
                window.location.reload();
            } catch (error) {
                console.error("Save notice error:", error);
                alert(error.message || "Unable to save notice.");
            }
        });
    </script>
</body>

</html>
