<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn Welcome To DAV Public School</title>
    <!-- Css link start -->
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <link href="/Assest/css/util.css" rel="stylesheet">
    <!-- Css link end -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>
    <div id="header"></div>

    <div class="">
    <div class="container-fluid login--page">
        <div class="row pt-2">
            <div class="limiter">
                <div class="container-login100">
                    <div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-48" style="position: relative;">
                        <form action="/" class="login100-form validate-form" id="frm_login_details" onsubmit="return false;">
                            <span class="login100-form-title p-b-33" style="color: #060e3b !important;">Account Login</span>
                            <div class="wrap-input100 validate-input" data-validate="Valid email is required:ex@abc.xyz">
                                <input autofocus class="input100 text-box single-line" id="username" name="UserName" placeholder="Email" required type="text" value="">
                                <span class="focus-input100-1"></span>
                                <span class="focus-input100-2"></span>
                            </div>
                            <div class="wrap-input100 rs1 validate-input" data-validate="Password is required">
                                <input class="input100 text-box single-line password" id="password" name="Password" placeholder="Password" required type="password" value="">
                                <span class="focus-input100-1"></span>
                                <span class="focus-input100-2"></span>
                            </div>
                            <div class="container-login100-form-btn m-t-20">
                                <input type="button" id="signInBtn" class="login100-form-btn" value="Sign in">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Js.js"></script>
    <script src="/Assest/js/site-data.js"></script>
    <script>
        // shared header / footer
        fetch("/Layout/Layout-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Error loading header:", error); });

        fetch("/Layout/Layout-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Error loading footer:", error); });
    </script>
    <script>
        $(function () {
            var button = document.getElementById("signInBtn");

            function login() {
                var username = document.getElementById("username").value.trim();
                var password = document.getElementById("password").value;

                if (!username) { alert("Please enter username"); return; }
                if (!password) { alert("Please input password."); return; }

                button.disabled = true;
                button.value = "Signing In...";

                fetch("/api/ourSchool/api-post-authenticate-user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ USER_NAME: username, PASSWORD: password })
                })
                    .then(function (response) { return response.json(); })
                    .then(function (result) {
                        if (result.status === "true" || result.status === true) {
                            var user = result.response && result.response[0];
                            if (!user) { alert("Login successful, but user details were not returned."); return; }

                            localStorage.setItem("authToken", result.Token || "");
                            ["USER_SYS_ID", "NAME", "EMAIL", "MOBILE_NO", "SYSTEM_ROLE_ID", "SYSTEM_ROLE_NAME", "USER_GROUP_SYS_ID",
                                "USER_GROUP_NAME", "ORGANISATION_SYS_ID", "TEMP_LOGIN", "INITIAL_LOGIN", "AUTHENTICATION_PROCESS"]
                                .forEach(function (key) { localStorage.setItem(key, user[key] == null ? "" : user[key]); });
                            localStorage.setItem("userId", user.USER_SYS_ID == null ? "" : user.USER_SYS_ID);
                            localStorage.setItem("userRole", user.SYSTEM_ROLE_NAME == null ? "" : user.SYSTEM_ROLE_NAME);
                            localStorage.setItem("userDetails", JSON.stringify(user));

                            window.location.href = "/Dav-Dashboard.html";
                        } else {
                            alert(result.message || (typeof result.response === "string" ? result.response : "") || "Invalid username or password.");
                        }
                    })
                    .catch(function (error) {
                        console.error("Login error:", error);
                        alert("Unable to connect with server. Please try again.");
                    })
                    .then(function () {
                        button.disabled = false;
                        button.value = "Sign in";
                    });
            }

            button.addEventListener("click", login);
            $("#username, #password").on("keydown", function (event) {
                if (event.key === "Enter") login();
            });
        });
    </script>
</body>

</html>
