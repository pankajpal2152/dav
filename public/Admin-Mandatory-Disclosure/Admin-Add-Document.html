<!-- No DOCTYPE on purpose: the live Add Mandatory Disclosure page renders in browser "quirks mode" and its form/input heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        ._txtarea_1{
            height: 76px; width: 81%;
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">Add Mandatory Disclosure</a>
            </li>
        </ul>
    </div>
    <!-- form start -->
    <div class="container-fluid" style="padding-bottom: 80px;">
        <div id="div_tc_details" class="row addTransfarForm">
            <div class="matrix_tableView">
                <div class="modal-body">
                    <form action="/" enctype="multipart/form-data" id="_idformMandatoryDisclosure" method="post" onsubmit="return false;">
                        <div class="form-row">
                            <div class="col-12 col-sm-6 col-md-3">
                                <input type="hidden" name="ITEM" value="ADD">
                                <label>Document Name<span style="color:red">*</span>:</label>
                                <input class="form-control text-box single-line" data-val="true" data-val-required="This field is required" id="_txtDocName" name="DOC_NAME" placeholder="Enter Doc. Name" type="text" value="">
                            </div>
                            <div class="col-12 col-sm-3 col-md-3">
                                <div class="col-md-12 p-0">
                                    <label>Upload MPD File (.PDF and less than 5MB)<span style="color:red">*</span>:</label>
                                    <input type="file" name="MPD_DOCUMENT_FILE" accept=".pdf" class="form-control" id="IDmcd_file_name">
                                </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label>Particulars<span style="color:red">*</span>:</label>
                                <textarea class="form-control" cols="35" data-val="true" data-val-required="This field is required" id="txt_perticulersdescrion" name="PERTICULERS_DESCRIPTION" placeholder="Enter Particulars" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="form-group mt-2">
                            <button type="button" class="btn btn-primary" id="idbtnSaveMandatoryDisclosureDetails">
                                <i class="fa fa-save"></i> Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        $("#idbtnSaveMandatoryDisclosureDetails").on("click", async function () {
            var button = this;
            var name = $("#_txtDocName").val().trim();
            var file = $("#IDmcd_file_name")[0].files[0];
            var particulars = $("#txt_perticulersdescrion").val().trim();

            if (!name) { alert("Please enter document name."); $("#_txtDocName").focus(); return; }
            if (!file) { alert("Please upload MPD file."); return; }
            if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { alert("Please upload a PDF file only."); return; }
            if (file.size >= 5 * 1024 * 1024) { alert("PDF file size must be less than 5 MB."); return; }
            if (!particulars) { alert("Please enter particulars."); $("#txt_perticulersdescrion").focus(); return; }
            if (!DavApi.requireLogin()) return;

            try {
                await DavApi.busy(button, async function () {
                    var uploaded = await DavApi.upload("mandatory-disclosure", [file]);

                    await DavApi.post("api-post-add-update-document-details", {
                        ITEM: "ADD",
                        RECORD_SYS_ID: 0,
                        TITLE: name,
                        DESCRIPTION: particulars,
                        FILE_NAME: uploaded[0].fileName
                    });
                });

                alert("Document saved successfully.");
                window.location.reload();
            } catch (error) {
                console.error("Save document error:", error);
                alert(error.message || "Unable to save document.");
            }
        });
    </script>
</body>

</html>
