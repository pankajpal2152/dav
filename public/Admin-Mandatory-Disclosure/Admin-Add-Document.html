<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To DAV Public School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        /* =========================================================
   ADD MANDATORY DISCLOSURE
   ========================================================= */

        .mandatory-disclosure-container {

            width: 90%;

            margin: 30px auto;

        }

        .mandatory-disclosure-title {

            text-align: center;

            text-decoration: underline;

            margin-bottom: 30px;

            color: #75112e;

            font-weight: 600;

        }

        .mandatory-disclosure-form {

            width: 100%;

            box-sizing: border-box;

            background-color: #fffef0;

            padding: 25px 30px;

            border-radius: 6px;

            border: 1px solid #f5f0c8;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

        }

        /* All three fields in same row */

        .mandatory-disclosure-first-row {

            display: grid;

            grid-template-columns: 1fr 1.2fr 1.5fr;

            gap: 25px;

            align-items: start;

        }

        .mandatory-disclosure-form-group {

            margin-bottom: 0;

        }

        .mandatory-disclosure-form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;

        }

        .mandatory-disclosure-form-group .form-control {

            width: 100%;

            height: 42px;

            box-sizing: border-box;

            padding: 8px 12px;

            border: 1px solid #ccc;

            border-radius: 4px;

            font-size: 14px;

        }

        .mandatory-disclosure-form-group .form-control:focus {

            outline: none;

            border-color: #75112e;

            box-shadow: 0 0 0 2px rgba(117, 17, 46, 0.1);

        }

        /* File input */

        .mandatory-disclosure-file-info {

            display: block;

            margin-top: 5px;

            color: #0d6efd;

            font-size: 13px;

        }

        /* Save button - next row, extreme left */

        .mandatory-disclosure-save-container {

            display: flex;

            justify-content: flex-start;

            align-items: center;

            margin-top: 25px;

        }

        .mandatory-disclosure-save-btn {

            min-width: 110px;

            padding: 9px 20px;

        }

        .mandatory-disclosure-save-btn i {

            margin-right: 6px;

        }

        /* Responsive */

        @media (max-width: 1000px) {

            .mandatory-disclosure-first-row {

                grid-template-columns: 1fr 1fr;

            }

        }

        @media (max-width: 767px) {

            .mandatory-disclosure-container {

                width: 95%;

            }

            .mandatory-disclosure-form {

                padding: 20px;

            }

            .mandatory-disclosure-first-row {

                grid-template-columns: 1fr;

            }

        }
        .required{
            color: red;
        }
    </style>
</head>

<body>
    <div id="header"></div>
    <main>

        <div class="mandatory-disclosure-container">

            <div class="mandatory-disclosure-form">

                <!-- First Row -->
                <div class="mandatory-disclosure-first-row">

                    <!-- Document Name -->
                    <div class="mandatory-disclosure-form-group">
                        <label for="documentName">

                            Document Name <span class="required">*</span>:
                        </label>

                        <input type="text" id="documentName" class="form-control" placeholder="Enter Doc. Name"
                            required>
                    </div>

                    <!-- Upload MPD File -->
                    <div class="mandatory-disclosure-form-group">
                        <label for="mpdFile">

                            Upload MPD File(.PDF and less than 5 MB) <span class="required">*</span>:
                            
                        </label>

                        <input type="file" id="mpdFile" class="form-control" accept=".pdf,application/pdf" required>
                    </div>

                    <!-- Particulars -->
                    <div class="mandatory-disclosure-form-group">
                        <label for="particulars">

                            Particulars <span class="required">*</span>:
                        </label>

                        <input type="text" id="particulars" class="form-control" placeholder="Enter Particulars"
                            required>
                    </div>

                </div>

                <!-- Save Button -->
                <div class="mandatory-disclosure-save-container">

                    <button type="button" class="btn btn-primary mandatory-disclosure-save-btn"
                        id="saveMandatoryDisclosure">

                        <i class="fa fa-floppy-o" aria-hidden="true"></i>

                        Save

                    </button>

                </div>

            </div>

        </div>



    </main>
    <div id="footer"></div>
    <script src="../Layout/Layout-Admin.js"></script>
    <script src="../Layout/Layout-Api.js"></script>
    <script>
        fetch("../Layout/Layout-Admin-Header.html")
            .then(response => response.text())
            .then(html => {
                document.getElementById("header").innerHTML = html;
                if (typeof initAdminLayoutNav === "function") {
                    initAdminLayoutNav();
                }
            })
            .catch(error => {
                console.error("Admin header loading error:", error);
            });
    </script>
    <script>
        fetch("../Layout/Layout-Admin-Footer.html")
            .then(r => r.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const saveButton = document.getElementById("saveMandatoryDisclosure");

            if (!saveButton) return;

            saveButton.addEventListener("click", async function () {

                const documentName = document.getElementById("documentName").value.trim();
                const mpdFile = document.getElementById("mpdFile").files[0];
                const particulars = document.getElementById("particulars").value.trim();

                // Mandatory validation

                if (!documentName) {
                    alert("Please enter document name.");
                    document.getElementById("documentName").focus();
                    return;
                }

                if (!mpdFile) {
                    alert("Please upload MPD file.");
                    document.getElementById("mpdFile").focus();
                    return;
                }

                // PDF validation

                if (mpdFile.type !== "application/pdf" && !mpdFile.name.toLowerCase().endsWith(".pdf")) {
                    alert("Please upload a PDF file only.");
                    document.getElementById("mpdFile").value = "";
                    return;
                }

                // 5 MB validation

                const maxSize = 5 * 1024 * 1024;

                if (mpdFile.size >= maxSize) {
                    alert("PDF file size must be less than 5 MB.");
                    document.getElementById("mpdFile").value = "";
                    return;
                }

                if (!particulars) {
                    alert("Please enter particulars.");
                    document.getElementById("particulars").focus();
                    return;
                }

                if (!DavApi.requireLogin()) return;

                try {
                    await DavApi.busy(saveButton, async () => {
                        const [uploaded] = await DavApi.upload("mandatory-disclosure", [mpdFile]);

                        await DavApi.post("api-post-add-update-document-details", {
                            ITEM: "ADD",
                            RECORD_SYS_ID: 0,
                            TITLE: documentName,
                            DESCRIPTION: particulars,
                            FILE_NAME: uploaded.fileName
                        });
                    });

                    alert("Document saved successfully.");
                    window.location.reload();
                } catch (error) {
                    console.error("Save document error:", error);
                    alert(error.message || "Unable to save document.");
                }

            });

        });

    </script>
</body>

</html>
