<!-- No DOCTYPE on purpose: the live View Mandatory Disclosure page renders in browser "quirks mode" and its table heights depend on it. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <title>DashboardControl</title>
    <style>
        ._txtarea_1 {
            height: 76px;
            width: 81%;
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <div class="container-fluid">
        <ul class="nav navbar-nav breadcrumb_ul">
            <li>
                <a href=""><i class="fa fa-home home_icon" aria-hidden="true"></i>&nbsp;<span>/</span></a>
                <a href="">Dashboard&nbsp;<span>/</span></a>
                <a href="" style="font-weight:bold">View Mandatory Disclosure</a>
            </li>
        </ul>
    </div>
   <div>
       <div class="container-fluid padding-11" style="padding-bottom: 80px;">
           <div class="row">
               <div class="col-md-12" id="tblmandatoryDisclosure_view">
                   <div class="school-info-table school-fees-table">
                       <table id="documentTable">
                           <thead>
                               <tr>
                                   <th>Sl.No.</th>
                                   <th>Particulars</th>
                                   <th>Document Name</th>
                                   <th>Action</th>
                               </tr>
                           </thead>
                           <tbody></tbody>
                       </table>
                   </div>
               </div>
           </div>
       </div>
       <div class="modal fade" id="record_update_popup" style="z-index: 2147483647; padding-left: 19px;">
           <div class="modal-dialog">
               <div class="modal-content">
                   <!-- Modal Header -->
                   <div class="modal-header sub-header">
                       <h4 class="modal-title">Add Edit Mandatory Disclosure Documents</h4>
                       <button type="button" class="close" data-dismiss="modal">×</button>
                   </div>
                   <!-- Modal body -->
                   <div class="modal-body">
                       <form id="frm_update_records" onsubmit="return false;">
                           <div class="row">
                               <div class="col-md-6">
                                   <div class="form-group">
                                       <input type="hidden" id="hiddenitem" name="ITEM" value="UPDATE">
                                       <input type="hidden" id="recordSysid" name="RECORD_SYS_ID">
                                       <label for="name">Document Name</label>
                                       <input class="form-control text-box single-line" style="width: 25rem;" id="txt_document_name" name="DOC_NAME" placeholder="Document Name" type="text" value="">
                                   </div>
                               </div>
                           </div>
                           <div class="row">
                               <div class="col-md-6">
                                   <div class="form-group">
                                       <label>Particulars<span style="color:red">*</span>:</label>
                                       <textarea class="form-control text-box single-line" style="width: 25rem;" id="particulars" name="PERTICULERS_DESCRIPTION" placeholder="Enter  particulars"></textarea>
                                   </div>
                               </div>
                           </div>
                           <div class="row">
                               <div class="col-md-7">
                                   <div class="form-group">
                                       <label for="uploadimg">Upload File(only PDF)</label>
                                       <input type="file" accept=".pdf" style="width: 25rem;" name="MPD_DOCUMENT_FILE" class="form-control" id="transfercertificate_file_name_upload">
                                   </div>
                               </div>
                           </div>
                       </form>
                       <button id="btn_update_records" class="btn btn-primary">
                           <i class="fa fa-save"></i> Save
                       </button>
                       <button class="btn btn-danger" data-dismiss="modal">No</button>
                   </div>
               </div>
           </div>
       </div>
       <div class="modal fade" id="record_delete_popup" style="z-index: 2147483647;">
           <div class="modal-dialog">
               <div class="modal-content">
                   <!-- Modal Header -->
                   <div class="modal-header sub-header">
                       <h4 class="modal-title"> Record Delete</h4>
                       <button type="button" class="close" data-dismiss="modal">×</button>
                   </div>
                   <!-- Modal body -->
                   <div class="modal-body">
                           <input type="hidden" id="RecordSysId" name="RECORD_SYS_ID">
                           <input type="hidden" id="RecordTitle">
                           <input type="hidden" id="item" name="ITEM" value="DELETE">
                           <label>Are you sure you want to Delete this record ?</label><br>
                           <button id="btn_delete_record_yes" class="btn btn-success">
                               <i class="fa fa-check"></i>Yes
                           </button>
                           <button class="btn btn-danger" data-dismiss="modal">No</button>
</div>
               </div>
           </div>
       </div>
   </div>

    <div id="footer"></div>

    <script src="/Layout/Layout-Admin.js"></script>
    <script src="/Layout/Layout-Api.js"></script>
    <script>
        // only for logged-in users
        if (!localStorage.getItem("authToken")) {
            window.location.href = "/Dav-Login.html";
        }

        fetch("/Layout/Layout-Admin-Header.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("header").innerHTML = html; })
            .catch(function (error) { console.error("Admin header loading error:", error); });

        fetch("/Layout/Layout-Admin-Footer.html")
            .then(function (r) { return r.text(); })
            .then(function (html) { document.getElementById("footer").innerHTML = html; })
            .catch(function (error) { console.error("Footer loading error:", error); });
    </script>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        /* ---------- list ---------- */
        function loadDocuments() {
            var body = $("#documentTable tbody");
            DavApi.get("api-get-view-document-details?ITEM=VIEW_ALL")
                .then(function (data) {
                    var rows = DavApi.rows(data.response);
                    if (!rows.length) { body.html('<tr><td colspan="4">No Data Found</td></tr>'); return; }
                    var html = "";
                    rows.forEach(function (d, i) {
                        html += '<tr>' +
                            '<td>' + (i + 1) + '</td>' +
                            '<td style="width: 800px;text-align:left;">' + esc(d.DESCRIPTION) + '</td>' +
                            '<td>' + esc(d.TITLE) + '</td>' +
                            '<td><button type="button" data-toggle="modal" data-target="#record_update_popup" id="btn_edit_record" title="Edit" class="btn btn-primary" data-particulars="' + esc(d.DESCRIPTION) + '" data-docname="' + esc(d.TITLE) + '" data-recordsys_id="' + esc(d.RECORD_SYS_ID) + '" data-filename="' + esc(d.FILE_NAME) + '" value="">Edit</button>&nbsp;' +
                            '<button type="button" id="btn_delete_record" data-toggle="modal" data-target="#record_delete_popup" title="Delete" class="btn btn-danger" data-recordsys_id="' + esc(d.RECORD_SYS_ID) + '" data-docname="' + esc(d.TITLE) + '" value="">Delete</button>&nbsp;' +
                            '<button class="btn btn-info" type="button" id="btn_download_tc" title="Download" data-filename="' + esc(d.FILE_NAME) + '" value="">View</button></td>' +
                            '</tr>';
                    });
                    body.html(html);
                })
                .catch(function (error) {
                    console.error("Document list error:", error);
                    body.html('<tr><td colspan="4">Unable to load data.</td></tr>');
                });
        }
        $(loadDocuments);

        /* ---------- view file ---------- */
        $(document).on("click", "#btn_download_tc", function () {
            var file = $(this).data("filename");
            if (!file) { alert("File not available."); return; }
            window.open("/Uploadfiles/DocumentFiles/" + encodeURIComponent(file), "_blank");
        });

        /* ---------- delete ---------- */
        $(document).on("click", "#btn_delete_record", function () {
            $("#RecordSysId").val($(this).data("recordsys_id"));
            $("#RecordTitle").val($(this).data("docname"));
        });
        $(document).on("click", "#btn_delete_record_yes", function () {
            // the delete procedure needs both the record id and the document name (title)
            DavApi.post("api-post-add-update-document-details", { ITEM: "DELETE", RECORD_SYS_ID: $("#RecordSysId").val(), TITLE: $("#RecordTitle").val() })
                .then(function () { alert("Record deleted successfully."); $("#record_delete_popup").modal("hide"); loadDocuments(); })
                .catch(function (e) { alert(e.message || "Oops!...Something went wrong"); });
        });

        /* ---------- edit ---------- */
        $(document).on("click", "#btn_edit_record", function () {
            var b = $(this);
            $("#recordSysid").val(b.data("recordsys_id"));
            $("#txt_document_name").val(b.data("docname"));
            $("#particulars").val(b.data("particulars"));
            $("#transfercertificate_file_name_upload").val("");
        });
        $(document).on("click", "#btn_update_records", function () {
            // The database procedure USP_POST_DOCUMENT_DETAILS_ACTIVITY only has ADD and DELETE (no UPDATE),
            // so an edit cannot be saved yet. Delete the document and add it again until it is extended.
            alert("Editing a document is not available yet (pending database fix). Please delete it and add it again.");
        });
    </script>
</body>

</html>
