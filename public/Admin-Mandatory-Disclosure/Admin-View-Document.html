<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To DAV Public School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/Assest/css/Style.css" rel="stylesheet">
    <link href="/Assest/css/Media.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        /* =========================================================
   VIEW MANDATORY DISCLOSURE
   ========================================================= */

        .mandatory-view-container {
            width: 90%;
            margin: 30px auto;
        }

        .mandatory-view-title {
            text-align: center;
            text-decoration: underline;
            margin-bottom: 30px;
            color: #75112e;
            font-weight: 600;
        }

        /* Table */
        .mandatory-table-wrapper {
            width: 90%;
            margin: 0 auto;
            overflow-x: auto;
        }

        .mandatory-table {
            width: 100%;
            margin-bottom: 0;
            border-collapse: collapse;
        }

        .mandatory-table th {
            background-color: #75112e;
            color: #ffffff;
            text-align: center;
            vertical-align: middle;
            padding: 12px;
            font-weight: 600;
            border: 1px solid #75112e;
        }

        .mandatory-table td {
            text-align: center;
            vertical-align: middle;
            padding: 10px;
            border: 1px solid #ddd;
        }

        /* Action Buttons */

        .mandatory-action-btn {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 4px;
            margin: 0 3px;
            cursor: pointer;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mandatory-edit-btn {
            background-color: #0d6efd;
        }

        .mandatory-edit-btn:hover {
            background-color: #0b5ed7;
        }

        .mandatory-delete-btn {
            background-color: #dc3545;
        }

        .mandatory-delete-btn:hover {
            background-color: #bb2d3b;
        }

        .mandatory-view-btn {
            background-color: #0dcaf0;
        }

        .mandatory-view-btn:hover {
            background-color: #31d2f2;
        }

        /* =========================================================
   EDIT MODAL
   ========================================================= */

        .mandatory-edit-modal {
            width: 600px;
            max-width: 90%;
        }

        .mandatory-edit-file-info {
            display: block;
            margin-top: 5px;
            color: #0d6efd;
            font-size: 13px;
        }

        /* Required star */
        .required {
            color: #ff0000 !important;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 767px) {
            .mandatory-view-container {
                width: 95%;
            }

            .mandatory-table-wrapper {
                width: 100%;
            }
        }

        .admin-modal {
            width: 500px;
            max-width: 90%;
            background: #ffffff;
            border-radius: 6px;
            overflow: visible;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
        }

        .admin-modal-small {
            width: 420px;
        }

        .admin-modal-header {
            background: #75112e;
            color: #ffffff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-modal-header h5 {
            margin: 0;
            font-size: 18px;
        }

        .admin-modal-close {
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .admin-modal-body {
            padding: 20px;
        }

        .admin-modal-field {
            margin-bottom: 18px;
        }

        .admin-modal-field:last-child {
            margin-bottom: 0;
        }

        .admin-modal-field label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .admin-modal-field .form-control {
            width: 100%;
            box-sizing: border-box;
            height: 42px;
        }

        .admin-modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .delete-confirmation {
            text-align: center;
            padding: 30px 20px;
        }

        .delete-confirmation p {
            margin: 0;
            font-size: 16px;
        }

        /* =========================================================
   MODAL OVERLAY
   ========================================================= */

        .admin-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .admin-modal-overlay.show {
            display: flex;
        }
    </style>
</head>

<body>
    <div id="header"></div>
    <main>
        <div class="mandatory-view-container">
            <!-- Table -->
            <div class="mandatory-table-wrapper">

                <table class="table mandatory-table">

                    <thead>
                        <tr>
                            <th>Sl No</th>
                            <th>Particulars</th>
                            <th>Document Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="mandatoryDisclosureTableBody">
                        
                    </tbody>

                </table>

            </div>

        </div>


        <!-- =========================
         EDIT MODAL
         ========================= -->

        <div class="admin-modal-overlay" id="updateMandatoryModal">

            <div class="admin-modal mandatory-edit-modal">

                <div class="admin-modal-header">

                    <h5>Update Mandatory Disclosure Record</h5>

                    <button type="button" class="admin-modal-close" id="closeUpdateMandatory">
                        &times;
                    </button>

                </div>


                <div class="admin-modal-body">

                    <!-- Document Name -->
                    <div class="admin-modal-field">

                        <label for="editDocumentName">

                            Document Name <span class="required">*</span>
                        </label>

                        <input type="text" id="editDocumentName" class="form-control" placeholder="Enter document name"
                            required>

                    </div>


                    <!-- Particulars -->
                    <div class="admin-modal-field">

                        <label for="editParticulars">

                            Particulars <span class="required">*</span>
                        </label>

                        <input type="text" id="editParticulars" class="form-control" placeholder="Enter particulars"
                            required>

                    </div>


                    <!-- Upload File -->
                    <div class="admin-modal-field">

                        <label for="editMpdFile">

                            Upload File
                        </label>

                        <input type="file" id="editMpdFile" class="form-control" accept=".pdf,application/pdf">

                        <small class="mandatory-edit-file-info">

                            Only PDF file, less than 5 MB
                        </small>

                    </div>

                </div>


                <div class="admin-modal-footer">

                    <button type="button" class="btn btn-primary" id="saveMandatoryUpdate">

                        Save
                    </button>

                    <button type="button" class="btn btn-danger" id="cancelMandatoryUpdate">

                        No
                    </button>

                </div>

            </div>

        </div>


        <!-- =========================

         DELETE MODAL

         ========================= -->

        <div class="admin-modal-overlay" id="deleteMandatoryModal">

            <div class="admin-modal admin-modal-small">

                <div class="admin-modal-header">

                    <h5>Mandatory Disclosure Record Delete</h5>

                    <button type="button" class="admin-modal-close" id="closeDeleteMandatory">
                        &times;
                    </button>

                </div>


                <div class="delete-confirmation">

                    <p>

                        Are you sure you want to delete?
                    </p>

                </div>


                <div class="admin-modal-footer">

                    <button type="button" class="btn btn-success" id="confirmMandatoryDelete">
                        <i class="fa fa-check"></i>

                        Yes
                    </button>

                    <button type="button" class="btn btn-danger" id="cancelMandatoryDelete">

                        No
                    </button>

                </div>

            </div>

        </div>

    </main>
    <div id="footer"></div>
    <script src="../Layout/Layout-Admin.js"></script>
    <script>
        fetch("../Layout/Layout-Admin-Header.html")
            .then(response => response.text())
            .then(html => {
                document.getElementById("header").innerHTML = html;
                if (typeof initAdminLayoutNav === "function") {
                    initAdminLayoutNav();
                }
            })
            .catch(error => {
                console.error("Admin header loading error:", error);
            });
    </script>
    <script>
        fetch("../Layout/Layout-Admin-Footer.html")
            .then(r => r.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script>
        let mandatoryDisclosureData = [];
        let selectedMandatoryDisclosure = null;

        document.addEventListener("DOMContentLoaded", function () {
            loadMandatoryDisclosure();
            initializeMandatoryModals();
            initializeMandatoryActions();
        });

        // GET DATA

        async function loadMandatoryDisclosure() {
            const tableBody = document.getElementById("mandatoryDisclosureTableBody");
            if (!tableBody) return;
            tableBody.innerHTML = `
                                    <tr>
                                    <td colspan="4" class="text-center text-muted">
                                                    Loading...
                                    </td>
                                    </tr>
                                        `;

            try {
                const token = localStorage.getItem("authToken");
                if (!token) {
                    alert("Session expired. Please login again.");
                    window.location.href = "/Dav-Login.html";
                    return;
                }

                const response = await fetch(
                    "/api/ourSchool/api-get-view-document-details?ITEM=VIEW_ALL",
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const result = await response.json();
                console.log("Mandatory Disclosure GET Response:", result);

                if (result.status !== "true" && result.status !== true) {
                    mandatoryDisclosureData = [];
                    renderMandatoryDisclosureTable();
                    return;
                }

                const apiResponse = Array.isArray(result.response) ? result.response : [];

                if (apiResponse.length === 0) {
                    mandatoryDisclosureData = [];
                    renderMandatoryDisclosureTable();
                    return;
                }

                const jsonValue = apiResponse[0]?.JSON_VALUE;

                // No data found

                if (jsonValue && jsonValue.status === "false" && jsonValue.response === "No Data Found") {
                    mandatoryDisclosureData = [];
                    renderMandatoryDisclosureTable();
                    return;
                }

                if (Array.isArray(jsonValue)) {
                    mandatoryDisclosureData = jsonValue;
                } else if (Array.isArray(jsonValue?.response)) {
                    mandatoryDisclosureData = jsonValue.response;
                } else {
                    mandatoryDisclosureData = apiResponse;
                }

                renderMandatoryDisclosureTable();

            } catch (error) {
                console.error(
                    "Mandatory Disclosure GET Error:",
                    error
                );

                mandatoryDisclosureData = [];
                tableBody.innerHTML = `
                                        <tr>
                                        <td colspan="4" class="text-center text-danger">
                                                            Unable to load data.
                                        </td>
                                        </tr>
                                                `;
            }
        }

        // RENDER TABLE

        function renderMandatoryDisclosureTable() {
            const tableBody = document.getElementById("mandatoryDisclosureTableBody");
            if (!tableBody) return;
            tableBody.innerHTML = "";

            if (
                !mandatoryDisclosureData ||
                mandatoryDisclosureData.length === 0
            ) {
                tableBody.innerHTML = `
                                        <tr>
                                        <td colspan="4" class="text-center text-muted">
                                                            No data found
                                        </td>
                                        </tr>
                                        `;
                return;
            }

            mandatoryDisclosureData.forEach(function (item, index) {
                const row = document.createElement("tr");

                row.innerHTML = `
                                <td>${index + 1}</td>
                    
                                <td>
                                    ${escapeHtml(item.PARTICULARS || "")}
                                </td>
                    
                                <td>
                                    ${escapeHtml(item.DOCUMENT_NAME || "")}
                                </td>
                    
                                <td>
                                    <button type="button"
                                        class="mandatory-action-btn mandatory-edit-btn"
                                        onclick="editMandatoryDisclosure(${index})"
                                        title="Edit">
                                        
                                    </button>
                    
                                    <button type="button"
                                        class="mandatory-action-btn mandatory-delete-btn"
                                        onclick="deleteMandatoryDisclosure(${index})"
                                        title="Delete">
                                        
                                    </button>
                    
                                    <button type="button"
                                        class="mandatory-action-btn mandatory-view-btn"
                                        onclick="viewMandatoryDisclosure(${index})"
                                        title="View">
                                        
                                    </button>
                                </td>
                            `;

                tableBody.appendChild(row);

            });
        }

        // EDIT

        function editMandatoryDisclosure(index) {
            const item = mandatoryDisclosureData[index];
            if (!item) return;
            selectedMandatoryDisclosure = item;
            document.getElementById("editDocumentName").value = item.DOCUMENT_NAME || "";
            document.getElementById("editParticulars").value = item.PARTICULARS || "";
            document.getElementById("editMpdFile").value = "";

            document.getElementById("updateMandatoryModal").classList.add("show");
        }

        // SAVE EDIT

        function saveMandatoryUpdate() {
            if (!selectedMandatoryDisclosure) return;

            const documentName = document.getElementById("editDocumentName").value.trim();
            const particulars = document.getElementById("editParticulars").value.trim();
            const file = document.getElementById("editMpdFile").files[0];
            if (!documentName) {
                alert("Please enter document name.");
                document.getElementById("editDocumentName").focus();
                return;
            }

            if (!particulars) {
                alert("Please enter particulars.");
                document.getElementById("editParticulars").focus();
                return;
            }

            // File is optional during update.

            // If selected, validate it.

            if (file) {
                if (
                    file.type !== "application/pdf" &&
                    !file.name.toLowerCase().endsWith(".pdf")
                ) {
                    alert("Please upload a PDF file only.");
                    document.getElementById("editMpdFile").value = "";
                    return;
                }

                const maxSize = 5 * 1024 * 1024;
                if (file.size >= maxSize) {
                    alert("PDF file size must be less than 5 MB.");
                    document.getElementById("editMpdFile").value = "";
                    return;
                }
            }

            const updateData = {
                MANDATORY_DISCLOSURE_SYS_ID: selectedMandatoryDisclosure.MANDATORY_DISCLOSURE_SYS_ID,
                DOCUMENT_NAME: documentName,
                PARTICULARS: particulars,
                FILE: file || null
            };
            console.log(
                "Update Mandatory Disclosure (payload ready, API pending):",
                updateData
            );

            // TODO: UPDATE API NOT AVAILABLE YET. Wire this up once the
            // backend endpoint is ready — payload above is already built.
            alert("Update API is not available yet.");

            closeMandatoryEditModal();
        }

        // DELETE

        function deleteMandatoryDisclosure(index) {
            const item = mandatoryDisclosureData[index];
            if (!item) return;
            selectedMandatoryDisclosure = item;
            document.getElementById("deleteMandatoryModal").classList.add("show");
        }

        // CONFIRM DELETE

        function confirmMandatoryDelete() {
            if (!selectedMandatoryDisclosure) return;

            console.log(
                "Delete Mandatory Disclosure (payload ready, API pending):",
                selectedMandatoryDisclosure
            );

            // TODO: DELETE API NOT AVAILABLE YET. Wire this up once the
            // backend endpoint is ready.
            alert("Delete API is not available yet.");

            closeMandatoryDeleteModal();
        }


        // ======================================================
        // VIEW
        // ======================================================

        function viewMandatoryDisclosure(index) {
            const item = mandatoryDisclosureData[index];
            if (!item) return;

            const fileUrl =

                item.FILE_URL ||

                item.MPD_FILE_URL ||

                item.DOCUMENT_URL ||

                item.FILE_PATH ||

                "";

            if (!fileUrl) {
                alert("Mandatory Disclosure file is not available.");
                return;
            }

            // Opens PDF/file in another browser tab.

            window.open(fileUrl, "_blank");
        }

        // ======================================================
        // MODALS
        // ======================================================

        function initializeMandatoryModals() {
            const updateModal = document.getElementById("updateMandatoryModal");
            const deleteModal = document.getElementById("deleteMandatoryModal");

            document.getElementById("closeUpdateMandatory").addEventListener("click", closeMandatoryEditModal);

            document.getElementById("cancelMandatoryUpdate").addEventListener("click", closeMandatoryEditModal);

            document.getElementById("closeDeleteMandatory").addEventListener("click", closeMandatoryDeleteModal);

            document.getElementById("cancelMandatoryDelete").addEventListener("click", closeMandatoryDeleteModal);

            updateModal.addEventListener("click", function (event) {
                if (event.target === updateModal) {
                    closeMandatoryEditModal();
                }
            });

            deleteModal.addEventListener("click", function (event) {
                if (event.target === deleteModal) {
                    closeMandatoryDeleteModal();
                }
            });
        }

        function closeMandatoryEditModal() {
            document.getElementById("updateMandatoryModal").classList.remove("show");
            selectedMandatoryDisclosure = null;
        }

        function closeMandatoryDeleteModal() {
            document.getElementById("deleteMandatoryModal").classList.remove("show");
            selectedMandatoryDisclosure = null;
        }

        // ======================================================
        // BUTTON EVENTS
        // ======================================================

        function initializeMandatoryActions() {
            document.getElementById("saveMandatoryUpdate").addEventListener("click", saveMandatoryUpdate);

            document.getElementById("confirmMandatoryDelete").addEventListener("click", confirmMandatoryDelete);
        }

        // ======================================================
        // HTML ESCAPE
        // ======================================================

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

    </script>
</body>

</html>
